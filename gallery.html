<script>
const SUPA_URL='https://iieahzklwngqugkovhrs.supabase.co';
const SUPA_KEY='sb_publishable_FHtRNaLBvDgDTSLa_8eQnQ_oPMWCIxF';
const $=id=>document.getElementById(id);
const enc=new TextEncoder();
const MINN=7,MAXN=145;
function Rof(n){return (n-1)/2}
function capacity(m,n){const R=Rof(n);
  if(m==='oct')return (R+1)*(R+2)/2;
  if(m==='quad')return (R+1)*(R+1);
  if(m==='half')return (R+1)*n;return 0;}
function baseCells(m,n){const c=Rof(n),R=c,o=[];
  if(m==='oct'){for(let i=0;i<=R;i++)for(let j=0;j<=i;j++)o.push([c+i,c+j]);}
  else if(m==='quad'){for(let i=0;i<=R;i++)for(let j=0;j<=R;j++)o.push([c+i,c+j]);}
  else{for(let y=0;y<n;y++)for(let i=0;i<=R;i++)o.push([c+i,y]);}
  return o;}
function mirrors(m,n,x,y){const c=Rof(n),i=x-c,j=y-c;let p;
  if(m==='oct')p=[[i,j],[j,i],[-i,j],[-j,i],[i,-j],[j,-i],[-i,-j],[-j,-i]];
  else if(m==='quad')p=[[i,j],[-i,j],[i,-j],[-i,-j]];
  else p=[[i,j],[-i,j]];
  const o=[];for(const [a,b] of p){const X=c+a,Y=c+b;if(X>=0&&Y>=0&&X<n&&Y<n)o.push([X,Y])}
  return o;}
function pickN2(m,need){for(let n=MINN;n<=MAXN;n+=2)if(capacity(m,n)>=need)return n;return MAXN;}
function textBits(t){const data=enc.encode(t);const bits=new Uint8Array(data.length*8);
  for(let i=0;i<data.length;i++)for(let b=0;b<8;b++)bits[i*8+b]=(data[i]>>(7-b))&1;return bits;}
function rowBuild(text,maxB){const chars=[...text],w=maxB*8,h=Math.max(chars.length,1);
  const g=new Uint8Array(w*h);
  chars.forEach((c,r)=>{const bs=enc.encode(c);
    for(let i=0;i<maxB;i++){const v=i<bs.length?bs[i]:0;
      for(let b=0;b<8;b++)g[r*w+i*8+b]=(v>>(7-b))&1;}});
  return {g,w,h};}
function fillChannel(t,n,m,markBit){
  const g=new Uint8Array(n*n),dm=new Uint8Array(n*n);
  const bc=baseCells(m,n);let seq;
  if(markBit===null||markBit===undefined){seq=textBits(t);}
  else{const bits=textBits(t);seq=new Uint8Array(bits.length+1);seq[0]=markBit;seq.set(bits,1);}
  const lim=Math.min(seq.length,bc.length);
  for(let i=0;i<lim;i++){const [x,y]=bc[i];
    for(const [X,Y] of mirrors(m,n,x,y)){dm[Y*n+X]=1;if(seq[i])g[Y*n+X]=1}}
  return {g,dm};}
const RGB_SOFT={r:[220,50,60],g:[65,195,65],b:[60,70,215]};
function renderBytecode(cv,rec){
  const s=rec.settings||{};
  const mode=rec.mode||'oct';
  const layers=rec.layers||1;
  /* Негатив: у монохромі одиниця й нуль міняються кольорами, тиха зона
     темніє; у RGB — повна інверсія пікселів наприкінці. */
  const NEG=!!s.invert&&layers!==3, NEG_RGB=!!s.invert&&layers===3;
  const colOne=NEG?(s.colZero||'#0d0a08'):(s.colOne||'#f5f5f5');
  const colZero=NEG?(s.colOne||'#f5f5f5'):(s.colZero||'#0d0a08');
  const frameW=(s.frame!==undefined)?s.frame:1;
  const words=layers===3?(s.words||[rec.word,'','']):[rec.word,'',''];
  const monoMark=s.monoMark||0;
  let W,H;const grid={},dmask={};
  if(mode==='row'){
    let maxB=1;words.forEach(t=>{for(const c of (t||'')){const k=enc.encode(c).length;if(k>maxB)maxB=k}});
    const h=Math.max(...words.map(t=>[...(t||'')].length),1);W=maxB*8;H=h;
    ['r','g','b'].forEach((k,i)=>{
      const g=new Uint8Array(W*H),dm=new Uint8Array(W*H);
      if(words[i]){const r=rowBuild(words[i],maxB);g.set(r.g.subarray(0,g.length));
        const rows=[...words[i]].length;
        for(let y=0;y<Math.min(rows,H);y++)for(let x=0;x<W;x++)dm[y*W+x]=1;}
      grid[k]=g;dmask[k]=dm;});
  }else{
    const extraR=(layers===3&&monoMark===1)?1:0;
    let maxBits=0;words.forEach(t=>{if(t)maxBits=Math.max(maxBits,enc.encode(t).length*8)});
    const n=pickN2(mode,maxBits+extraR);W=H=n;
    ['r','g','b'].forEach((k,i)=>{
      let markBit=null;if(layers===3&&monoMark===1&&i===0)markBit=1;
      const r=fillChannel(words[i]||'',n,mode,markBit);
      grid[k]=r.g;dmask[k]=r.dm;});
  }
  /* Роботи, опубліковані з кольоровою рамкою, мають прапорець frameColor.
     Старі роботи його не мають — для них рамка лишається чорно-білою,
     як була при публікації. */
  const fc=!!s.frameColor&&layers!==3;
  const FRAME_A=fc?colZero:(NEG?'#f4efe6':'#0a0806'), FRAME_B=fc?colOne:(NEG?'#0a0806':'#f4efe6');
  const qz=2;
  const pad=3,tw=W+pad*2+qz*2,th=H+pad*2+qz*2;
  const cell=Math.max(1,Math.floor(cv.width/Math.max(tw,th)));
  const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
  const ox=Math.floor((cv.width-tw*cell)/2),oy=Math.floor((cv.height-th*cell)/2);

  ctx.fillStyle='#0a0806';
  ctx.fillRect(0,0,cv.width,cv.height);

  /* внешняя quiet zone: светлая, у негатива — тёмная */
  ctx.fillStyle=NEG?'#0a0806':'#ffffff';
  ctx.fillRect(ox,oy,tw*cell,th*cell);

  if(pad>=3){
    const CW=W+pad*2, CHc=H+pad*2;

    const fox=ox+qz*cell;
    const foy=oy+qz*cell;

    const cellAt=(cx,cy,col)=>{
      ctx.fillStyle=col;
      ctx.fillRect(fox+cx*cell,foy+cy*cell,cell,cell);
    };

    ctx.fillStyle=colZero;
    ctx.fillRect(fox,foy,CW*cell,CHc*cell);

    for(let cx=0;cx<CW;cx++){
      cellAt(cx,0,FRAME_A);
      cellAt(cx,CHc-1,FRAME_A);
    }

    for(let cy=1;cy<CHc-1;cy++){
      cellAt(0,cy,FRAME_A);
      cellAt(CW-1,cy,FRAME_A);
    }

    for(let cx=1;cx<CW-1;cx++){
      cellAt(cx,1,FRAME_B);
      cellAt(cx,CHc-2,FRAME_B);
    }

    for(let cy=2;cy<CHc-2;cy++){
      cellAt(1,cy,FRAME_B);
      cellAt(CW-2,cy,FRAME_B);
    }

    for(let cx=2;cx<CW-2;cx++){
      cellAt(cx,2,((cx+2)%2===0)?FRAME_A:FRAME_B);
      cellAt(cx,CHc-3,((cx+CHc-3)%2===0)?FRAME_A:FRAME_B);
    }

    for(let cy=3;cy<CHc-3;cy++){
      cellAt(2,cy,((2+cy)%2===0)?FRAME_A:FRAME_B);
      cellAt(CW-3,cy,((CW-3+cy)%2===0)?FRAME_A:FRAME_B);
    }

  }else if(pad>0){
    ctx.fillStyle='#8f8f8f';
    ctx.fillRect(
      ox+qz*cell,
      oy+qz*cell,
      (W+pad*2)*cell,
      (H+pad*2)*cell
    );
  }

  ctx.fillStyle=colZero;
  ctx.fillRect(
    ox+(pad+qz)*cell,
    oy+(pad+qz)*cell,
    W*cell,
    H*cell
  );
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=y*W+x;
    if(layers===3){
      const on={r:dmask.r[i]&&grid.r[i],g:dmask.g[i]&&grid.g[i],b:dmask.b[i]&&grid.b[i]};
      if(!on.r&&!on.g&&!on.b)continue;
      let R=0,G=0,B=0;
      if(on.r){R+=RGB_SOFT.r[0];G+=RGB_SOFT.r[1];B+=RGB_SOFT.r[2]}
      if(on.g){R+=RGB_SOFT.g[0];G+=RGB_SOFT.g[1];B+=RGB_SOFT.g[2]}
      if(on.b){R+=RGB_SOFT.b[0];G+=RGB_SOFT.b[1];B+=RGB_SOFT.b[2]}
      ctx.fillStyle=`rgb(${Math.min(255,R)},${Math.min(255,G)},${Math.min(255,B)})`;
      ctx.fillRect(ox+(x+pad+qz)*cell,oy+(y+pad+qz)*cell,cell,cell);
    }else{
      if(!dmask.r[i]||!grid.r[i])continue;
      ctx.fillStyle=colOne;
      ctx.fillRect(ox+(x+pad+qz)*cell,oy+(y+pad+qz)*cell,cell,cell);
    }
  }
  if(NEG_RGB){const d=ctx.getImageData(ox,oy,tw*cell,th*cell),a=d.data;
    for(let i=0;i<a.length;i+=4){a[i]=255-a[i];a[i+1]=255-a[i+1];a[i+2]=255-a[i+2];}
    ctx.putImageData(d,ox,oy);}
}
async function loadGallery(){
  try{
    const resp=await fetch(`${SUPA_URL}/rest/v1/bytecodes?select=*&order=created_at.desc&limit=200`,{
      headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`}
    });
    if(!resp.ok){const txt=await resp.text();showError(resp.status,txt);return;}
    const data=await resp.json();renderGallery(data);
  }catch(e){showError('network',e.message);}
}
function showError(status,detail){
  $('count').textContent='помилка';
  $('content').innerHTML=`<div class="status err">
    <div class="t err-t">Не вдалося завантажити галерею</div>
    <div>Статус: <code>${status}</code></div>
    <div style="margin-top:8px;color:var(--muted);word-break:break-all">${(detail||'').slice(0,200)}</div>
    <div class="hint">Це діагностика для налаштування. Найчастіші причини:<br>
    • політики доступу (RLS) не дозволяють читання<br>
    • невірний ключ або URL<br>
    • таблиця називається не <code>bytecodes</code></div>
  </div>`;
}
function renderGallery(items){
  ALL_ITEMS=items;
  $('count').textContent=items.length===0?'поки порожньо':`${items.length} орнаментів`;
  if(!items.length){
    $('content').innerHTML=`<div class="empty">Галерея поки порожня.<br>
      Будь першим — створи орнамент у <a href="index.html" style="color:var(--acc)">лабораторії</a> і опублікуй.</div>`;
    return;
  }
  const grid=document.createElement('div');grid.className='grid';
  items.forEach(rec=>{
    const card=document.createElement('div');card.className='card';
    const cv=document.createElement('canvas');cv.width=cv.height=400;
    card.appendChild(cv);
    const w=document.createElement('div');w.className='word';w.textContent=rec.title||rec.word;card.appendChild(w);
    const meta=document.createElement('div');meta.className='meta';
    const modeLabel={oct:'×8',quad:'×4',half:'×2',row:'×1'}[rec.mode]||rec.mode;
    meta.innerHTML=`<span>${modeLabel}</span>${rec.layers===3?'<span>RGB</span>':''}${rec.lang?`<span>${rec.lang}</span>`:''}`;
    card.appendChild(meta);
    try{renderBytecode(cv,rec)}catch(e){}
    card.onclick=()=>openWork(rec);
    grid.appendChild(card);
  });
  $('content').innerHTML='';$('content').appendChild(grid);
  openFromURL();
}
let ALL_ITEMS=[];
let curRec=null;
function openWork(rec){
  curRec=rec;
  renderBytecode($('modal-cv'),rec);
  $('modal-word').textContent=rec.title||rec.word;
  const modeLabel={oct:'×8',quad:'×4',half:'×2',row:'×1'}[rec.mode]||rec.mode;
  $('modal-meta').textContent=`симетрія ${modeLabel}${rec.layers===3?' · RGB':''}${rec.lang?' · '+rec.lang:''} · читабельний орнамент`;
  $('gmodal').classList.add('show');
  /* свій адрес для цієї роботи */
  if(rec.id!==undefined){
    history.replaceState(null,'',`?id=${rec.id}`);
    document.title=`«${rec.title||rec.word}» — читабельний орнамент · taina`;
  }
}
function closeWork(){
  $('gmodal').classList.remove('show');
  history.replaceState(null,'',location.pathname);
  document.title='Галерея орнаментів · taina';
}
$('gmodal-close').onclick=closeWork;
$('gmodal').onclick=e=>{if(e.target===$('gmodal'))closeWork();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeWork();});

/* ═══════ ПОДІЛИТИСЯ ═══════
   toast() приходить із shell.js — свого тоста сторінка більше не тримає. */
function itemUrl(){
  const m=location.search.match(/id=([^&]+)/);
  return m?location.origin+'/item/'+m[1]:location.href;
}
async function copyLinkFallback(){
  const u=itemUrl();
  try{
    await navigator.clipboard.writeText(u);
    toast('Посилання скопійовано');
  }catch(e){
    try{
      const inp=document.createElement('input');
      inp.value=u;inp.style.cssText='position:fixed;left:-9999px';
      document.body.appendChild(inp);inp.select();
      document.execCommand&&document.execCommand('copy');
      inp.remove();toast('Посилання скопійовано');
    }catch(_){toast('Не вдалося скопіювати');}
  }
}
$('share-link').onclick=copyLinkFallback;
$('share-btn').onclick=async()=>{
  const word=curRec?(curRec.title||curRec.word):'taina';
  const shareData={title:'taina',text:`Орнамент, що містить текст — ${word}. Створено на taina.`,url:itemUrl()};
  if(navigator.share){
    try{await navigator.share(shareData);}
    catch(err){if(err&&err.name!=='AbortError')await copyLinkFallback();}
  }else{
    await copyLinkFallback();
  }
};

/* якщо зайшли за прямим посиланням ?id=N — відкрити цю роботу */
function openFromURL(){
  const id=new URLSearchParams(location.search).get('id');
  if(!id)return;
  const rec=ALL_ITEMS.find(r=>String(r.id)===String(id));
  if(rec)openWork(rec);
}
loadGallery();
