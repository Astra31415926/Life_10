<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>taina · Послуги</title>
<meta name="description" content="Фізичне втілення закодованих орнаментів. Замовте мерч з вашим унікальним кодом.">
<link rel="canonical" href="https://astra31415926.github.io/Life_10/services.html">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Спільна оболонка: токени теми, шапка, модалки «Проєкт/Тариф/Контакти», тост. -->
<link rel="stylesheet" href="shell.css">
<script defer src="shell.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--parchment);font-family:var(--sans);line-height:1.5;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,color-mix(in srgb,var(--acc) 8%,transparent),transparent);
  display:flex;flex-direction:column;min-height:100vh;transition:background-image .5s}

button{font-family:inherit}
button:focus-visible{outline:2px solid var(--acc-hot);outline-offset:2px}

/* Контент */
.services-container{max-width:1200px;width:100%;margin:0 auto;padding:40px 20px 80px;flex:1 1 auto}

/* Hero */
.hero{text-align:center;padding:60px 0 40px}
.hero h1{font-family:var(--sans);font-size:clamp(28px,5vw,44px);font-weight:600;color:var(--parchment);margin-bottom:16px;line-height:1.2}

/* Сітка товарів */
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-5px);border-color:var(--acc-dim);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.card-img{width:100%;height:100%;object-fit:cover;display:block}

/* Накладання орнаменту прямо на предмет */
.orn-overlay{
  position:absolute;
  transform:translate(-50%, -50%);
  display:none;
  pointer-events:none;
  mix-blend-mode:multiply;
  opacity:0.85;
  filter:contrast(1.1);
  z-index:2;
}
.orn-overlay img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
.card.has-orn .orn-overlay{display:block;animation:ornIn .4s ease-out}
@keyframes ornIn{from{opacity:0;transform:translate(-50%, -45%) scale(.92)}to{opacity:0.85;transform:translate(-50%, -50%) scale(1)}}

/* Нижня плашка з назвою та кнопкою */
.card-bottom{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:16px;
  background:linear-gradient(transparent, rgba(0,0,0,0.85));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  z-index:3;
}
.card-bottom h3{
  font-family:var(--mono);
  font-size:16px;
  color:#fff;
  font-weight:700;
  margin:0;
  text-shadow:0 1px 3px rgba(0,0,0,0.5);
}
.card-bottom .action-btn{
  width:auto;
  flex-shrink:0;
  font-family:var(--mono);
  font-size:12px;
  font-weight:600;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  transition:.15s;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.15);
  color:#fff;
  backdrop-filter:blur(4px);
}
.card-bottom .action-btn:hover{
  background:rgba(255,255,255,0.25);
  border-color:rgba(255,255,255,0.5);
  color:#fff;
}

/* Єдиний блок контактів */
.contacts-block{margin:60px auto 0;max-width:760px;text-align:center;padding:42px 28px;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 7%,transparent),transparent 70%),var(--panel);
  box-shadow:0 10px 40px rgba(0,0,0,.4)}
.contacts-block h2{font-family:var(--sans);font-size:clamp(20px,3vw,26px);font-weight:600;color:var(--parchment);margin-bottom:12px;line-height:1.3}
.contacts-block .sub{font-size:14.5px;color:var(--muted);margin-bottom:26px;line-height:1.6}
.contacts-block .btn-main{font-size:15px;padding:16px 32px}

/* Кнопка main */
.btn-main{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.06em;
  padding:14px 24px;border-radius:12px;cursor:pointer;transition:.18s;border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 30%,transparent),color-mix(in srgb,var(--acc) 12%,transparent));
  color:var(--acc-hot);text-decoration:none;text-transform:uppercase}
.btn-main:hover{border-color:var(--acc-hot);box-shadow:0 0 30px color-mix(in srgb,var(--acc) 30%,transparent)}

/* Власний тост цієї сторінки: вміє показувати посилання всередині.
   Id навмисно svc-toast — #toast зайнятий тостом оболонки. */
#svc-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--panel2);
  border:1px solid var(--acc);color:var(--parchment);padding:16px 24px;border-radius:12px;font-size:14px;font-family:var(--sans);
  box-shadow:0 10px 40px rgba(0,0,0,.6);z-index:2000;opacity:0;transition:transform .3s ease-out,opacity .3s;max-width:90%;text-align:center}
#svc-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#svc-toast b{color:var(--acc-hot)}

@media(max-width:820px){
  .hero{padding:40px 0 28px}
  .services-container{padding:20px 16px 60px}
  .contacts-block{padding:30px 20px;margin-top:44px}
}
</style>
</head>
<body class="room-mono">

<div id="hdr"></div>

<div class="services-container">
  <section class="hero">
    <h1 id="svcHero">Фізичне втілення закодованих орнаментів</h1>
  </section>

  <section class="catalog" id="catalog">
    <!-- Карточки згенеруються JavaScript -->
  </section>

<section class="contacts-block">
    <h2 id="svcAskH">Бажаєте зробити індивідуальне замовлення або виникли запитання?</h2>
    <p class="sub" id="svcAskP">Напишіть нам — обговоримо матеріали, тираж та підготовку вашого коду до друку.</p>
    <a href="https://t.me/+hmCY-X-wZjgzZmMy" target="_blank" rel="noopener" class="btn-main" id="contactTg">Написати в Telegram</a>
  </section>
</div>

<div id="svc-toast"></div>

<script>
/* ═══ МОВА СТОРІНКИ ═══
   Мову обирають кнопкою UA/EN у Лабораторії; тут лише читаємо вибір. */
let SVC_LANG='uk';
try{SVC_LANG=localStorage.getItem('taina_lang')==='en'?'en':'uk';}catch(e){}
const SVC={
  uk:{hero:'Фізичне втілення закодованих орнаментів',
      askH:'Бажаєте зробити індивідуальне замовлення або виникли запитання?',
      askP:'Напишіть нам — обговоримо матеріали, тираж та підготовку вашого коду до друку.',
      tg:'Написати в Telegram', orn:'Ваш орнамент',
      first:"Спершу створіть та збережіть орнамент у <a href='index.html' style='color:var(--acc-hot)'>Лабораторії</a>.",
      title:'taina · Послуги'},
  en:{hero:'Encoded ornaments, made physical',
      askH:'Want a custom order or have a question?',
      askP:'Write to us — we will discuss materials, print run and preparing your code for print.',
      tg:'Message on Telegram', orn:'Your ornament',
      first:"First create and save an ornament in the <a href='index.html' style='color:var(--acc-hot)'>Laboratory</a>.",
      title:'taina · Services'}
}[SVC_LANG];
document.documentElement.lang=(SVC_LANG==='en')?'en':'uk';
document.title=SVC.title;
document.getElementById('svcHero').textContent=SVC.hero;
document.getElementById('svcAskH').textContent=SVC.askH;
document.getElementById('svcAskP').textContent=SVC.askP;
document.getElementById('contactTg').textContent=SVC.tg;

const products = [
  { 
    img: "tshirt.png", 
    title: "Футболка", title_en: "T-shirt", 
    ornPos: "top:60%; left:50%; width:28%; height:auto;" 
  },
  { 
    img: "mug.png", 
    title: "Кружка керамічна", title_en: "Ceramic mug", 
    ornPos: "top:49%; left:47%; width:34%; height:auto;" 
  },
  { 
    img: "bag.png", 
    title: "Еко-шопер", title_en: "Eco tote bag", 
    ornPos: "top:54%; left:50%; width:38%; height:auto;" 
  },
  { 
    img: "bracelet.png", 
    title: "Силіконовий браслет", title_en: "Silicone bracelet", 
    ornPos: "top:24%; left:50%; width:11%; height:auto;" 
  },
  { 
    img: "case.png", 
    title: "Чохол для смартфона", title_en: "Phone case", 
    ornPos: "top:58%; left:51%; width:34%; height:auto;" 
  },
  { 
    img: "pendant.png", 
    title: "Медальйон", title_en: "Pendant", 
    ornPos: "top:52.8%; left:49.8%; width:26%; height:auto;" 
  }
];
const catalog = document.getElementById('catalog');

products.forEach(product => {
  const card = document.createElement('div');
  card.className = 'card';

  const ttl = (SVC_LANG==='en') ? product.title_en : product.title;
  card.innerHTML = `
    <img src="${product.img}" alt="${ttl}" class="card-img" onerror="this.style.opacity=0">
    <div class="orn-overlay" style="${product.ornPos || ''}"><img alt="${SVC.orn}"></div>
    <div class="card-bottom">
      <h3>${ttl}</h3>
    </div>`;

  catalog.appendChild(card);
});
/* ===== Підстановка збереженого орнаменту в макети ===== */
function applyOrnamentToMockups(){
  let data = null;
  try { data = localStorage.getItem('taina_last_ornament'); } catch(e){}

  const cards = document.querySelectorAll('.card');
  if(data){
    cards.forEach(card=>{
      card.classList.add('has-orn');
      const img = card.querySelector('.orn-overlay img');
      if(img) img.src = data;
    });
  } else {
    cards.forEach(card=>card.classList.remove('has-orn'));
  }
}
applyOrnamentToMockups();

window.addEventListener('storage', e=>{
  if(e.key === 'taina_last_ornament') applyOrnamentToMockups();
});

/* ===== Toast цієї сторінки (вміє показувати посилання) ===== */
const svcToast = document.getElementById('svc-toast');
let toastTimeout;
function showToast(msg){
  clearTimeout(toastTimeout);
  svcToast.innerHTML = msg;
  svcToast.classList.add('show');
  toastTimeout = setTimeout(()=>svcToast.classList.remove('show'), 5000);
}

/* ===== Копіювання/завантаження орнаменту ===== */
function downloadDataUrl(dataUrl, filename){
  const a = document.createElement('a');
  a.href = dataUrl; a.download = filename || 'taina_ornament.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
async function copyToClipboard(blob){
  try{
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    return true;
  }catch(e){ console.error('Clipboard copy failed', e); return false; }
}

/* ===== Копіювання орнаменту при кліку на посилання ===== */
document.querySelectorAll('.card-bottom .action-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    let ornamentData = null;
    try { ornamentData = localStorage.getItem('taina_last_ornament'); } catch(err){}

    // Якщо орнаменту немає — зупиняємо перехід і переправляємо в Лабораторію
    if (!ornamentData) {
      e.preventDefault();
      showToast(SVC.first);
      setTimeout(() => { window.location.href = 'index.html'; }, 2500);
      return;
    }

    // Якщо орнамент є — браузер штатно відкриває Telegram,
    // а ми паралельно у фоні копіюємо картинку в буфер обміну
    fetch(ornamentData)
      .then(res => res.blob())
      .then(blob => copyToClipboard(blob))
      .catch(err => console.error("Помилка копіювання", err));
  });
});
</script>
</body>
</html>
