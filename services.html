<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>taina · Послуги</title>
<meta name="description" content="Фізичне втілення закодованих орнаментів. Замовте мерч з вашим унікальним кодом.">
<link rel="canonical" href="https://astra31415926.github.io/Life_10/services.html">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0a08;--panel:#15100b;--panel2:#1d1610;
  --acc:#c9a876;--acc-hot:#e8c890;--acc-dim:#8f7451;
  --parchment:#ede3d0;--muted:#94836a;--line:rgba(201,168,118,.22);
  --ok:#58d668;--bad:#e5705a;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif;
}
body.room-rgb{--acc:#5ec8e8;--acc-hot:#8fe4ff;--acc-dim:#3f7f96;--line:rgba(94,200,232,.24)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--parchment);font-family:var(--sans);line-height:1.5;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,color-mix(in srgb,var(--acc) 8%,transparent),transparent);
  display:flex;flex-direction:column;min-height:100vh;transition:background-image .5s}

button{font-family:inherit}
button:focus-visible{outline:2px solid var(--acc-hot);outline-offset:2px}

/* Шапка */
header{border-bottom:1px solid var(--line);flex:0 0 auto;background:rgba(13,10,8,.9);
  backdrop-filter:blur(10px);position:sticky;top:0;z-index:60;transition:border-color .4s}
.nav{display:flex;align-items:center;gap:14px;height:54px;max-width:1560px;margin:0 auto;padding:0 20px}
.mark{font-family:var(--mono);font-weight:700;font-size:18px;letter-spacing:.07em;color:var(--parchment);display:flex;align-items:center;gap:8px;text-decoration:none}
.mark::after{content:'';width:7px;height:7px;background:var(--acc);transition:background .4s}
.navbtns{margin-left:auto;display:flex;gap:6px}
.roomnav{display:flex;gap:6px;margin-left:6px}
.roomtab{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:8px 14px;border:1px solid var(--line);border-radius:9px;text-transform:uppercase;transition:.15s;text-decoration:none;white-space:nowrap;background:transparent;cursor:pointer}
.roomtab:hover{color:var(--acc-hot);border-color:var(--acc-dim)}
.roomtab.on{color:var(--acc-hot);border-color:rgba(201,162,103,.5);background:color-mix(in srgb,var(--acc) 12%,transparent);cursor:default}

/* Контент */
.services-container{max-width:1200px;width:100%;margin:0 auto;padding:40px 20px 80px;flex:1 1 auto}

/* Hero */
.hero{text-align:center;padding:60px 0 40px}
.hero h1{font-family:var(--sans);font-size:clamp(28px,5vw,44px);font-weight:600;color:var(--parchment);margin-bottom:16px;line-height:1.2}

/* Сітка товарів */
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{
  position:relative;
  aspect-ratio:1/1;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--panel);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-5px);border-color:var(--acc-dim);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.card-img{width:100%;height:100%;object-fit:cover;display:block}

/* Накладання орнаменту прямо на предмет */
.orn-overlay{
  position:absolute;
  transform:translate(-50%, -50%);
  display:none;
  pointer-events:none;
  mix-blend-mode:multiply;
  opacity:0.85;
  filter:contrast(1.1);
  z-index:2;
}
.orn-overlay img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
.card.has-orn .orn-overlay{display:block;animation:ornIn .4s ease-out}
@keyframes ornIn{from{opacity:0;transform:translate(-50%, -45%) scale(.92)}to{opacity:0.85;transform:translate(-50%, -50%) scale(1)}}

/* Нижня плашка з назвою та кнопкою */
.card-bottom{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:16px;
  background:linear-gradient(transparent, rgba(0,0,0,0.85));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  z-index:3;
}
.card-bottom h3{
  font-family:var(--mono);
  font-size:16px;
  color:#fff;
  font-weight:700;
  margin:0;
  text-shadow:0 1px 3px rgba(0,0,0,0.5);
}
.card-bottom .action-btn{
  width:auto;
  flex-shrink:0;
  font-family:var(--mono);
  font-size:12px;
  font-weight:600;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  transition:.15s;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.15);
  color:#fff;
  backdrop-filter:blur(4px);
}
.card-bottom .action-btn:hover{
  background:rgba(255,255,255,0.25);
  border-color:rgba(255,255,255,0.5);
  color:#fff;
}

/* Єдиний блок контактів */
.contacts-block{margin:60px auto 0;max-width:760px;text-align:center;padding:42px 28px;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 7%,transparent),transparent 70%),var(--panel);
  box-shadow:0 10px 40px rgba(0,0,0,.4)}
.contacts-block h2{font-family:var(--sans);font-size:clamp(20px,3vw,26px);font-weight:600;color:var(--parchment);margin-bottom:12px;line-height:1.3}
.contacts-block .sub{font-size:14.5px;color:var(--muted);margin-bottom:26px;line-height:1.6}
.contacts-block .btn-main{font-size:15px;padding:16px 32px}

/* Кнопка main */
.btn-main{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.06em;
  padding:14px 24px;border-radius:12px;cursor:pointer;transition:.18s;border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 30%,transparent),color-mix(in srgb,var(--acc) 12%,transparent));
  color:var(--acc-hot);text-decoration:none;text-transform:uppercase}
.btn-main:hover{border-color:var(--acc-hot);box-shadow:0 0 30px color-mix(in srgb,var(--acc) 30%,transparent)}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--panel2);border:1px solid var(--acc);color:var(--parchment);padding:16px 24px;border-radius:12px;font-size:14px;font-family:var(--sans);box-shadow:0 10px 40px rgba(0,0,0,.6);z-index:2000;opacity:0;transition:transform .3s ease-out,opacity .3s;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast b{color:var(--acc-hot)}

@media(max-width:768px){
  .hero{padding:40px 0 28px}
  .services-container{padding:20px 16px 60px}
  .roomtab{padding:8px 10px;font-size:10px}
  .contacts-block{padding:30px 20px;margin-top:44px}
}
</style>
</head>
<body class="room-mono">

<header><div class="nav">
 <a href="index.html" class="mark">taina</a>
  <div class="roomnav">
    <a href="index.html" class="roomtab">Лабораторія</a>
    <a href="services.html" class="roomtab on">Послуги</a>
    <a href="gallery.html" class="roomtab">Галерея</a>
  </div>
</div></header>

<div class="services-container">
  <section class="hero">
    <h1>Фізичне втілення закодованих орнаментів</h1>
  </section>

  <section class="catalog" id="catalog">
    <!-- Карточки згенеруються JavaScript -->
  </section>

  <section class="contacts-block">
    <h2>Бажаєте зробити індивідуальне замовлення або виникли запитання?</h2>
    <p class="sub">Напишіть нам — обговоримо матеріали, тираж та підготовку вашого коду до друку.</p>
    <a href="https://t.me/forpost_art_techno" target="_blank" rel="noopener" class="btn-main" id="contactTg">Написати в Telegram</a>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const products = [
  { 
    img: "tshirt.png", 
    title: "Футболка", 
    ornPos: "top:60%; left:50%; width:28%; height:auto;" 
  },
  { 
    img: "mug.png", 
    title: "Кружка керамічна", 
    ornPos: "top:49%; left:47%; width:34%; height:auto;" 
  },
  { 
    img: "bag.png", 
    title: "Еко-шопер", 
    ornPos: "top:54%; left:50%; width:38%; height:auto;" 
  },
  { 
    img: "bracelet.png", 
    title: "Силіконовий браслет", 
    ornPos: "top:24%; left:50%; width:11%; height:auto;" 
  },
  { 
    img: "case.png", 
    title: "Чохол для смартфона", 
    ornPos: "top:58%; left:51%; width:34%; height:auto;" 
  },
  { 
    img: "pendant.png", 
    title: "Медальйон", 
    ornPos: "top:52.8%; left:49.8%; width:26%; height:auto;" 
  }
];
const catalog = document.getElementById('catalog');

products.forEach(product => {
  const card = document.createElement('div');
  card.className = 'card';

  // Формуємо текст та посилання для кожної картки
  const message = `Вітаю! Хочу замовити: ${product.title}. Орнамент додаю до повідомлення.`;
  const tgUrl = `https://t.me/forpost_art_techno?text=${encodeURIComponent(message)}`;

  card.innerHTML = `
    <img src="${product.img}" alt="${product.title}" class="card-img" onerror="this.style.opacity=0">
    <div class="orn-overlay" style="${product.ornPos || ''}"><img alt="Ваш орнамент"></div>
    <div class="card-bottom">
      <h3>${product.title}</h3>
      <a href="${tgUrl}" target="_blank" rel="noopener" class="action-btn" data-title="${product.title}">Замовити</a>
    </div>`;
  catalog.appendChild(card);
});

/* ===== Підстановка збереженого орнаменту в макети ===== */
function applyOrnamentToMockups(){
  let data = null;
  try { data = localStorage.getItem('taina_last_ornament'); } catch(e){}

  const cards = document.querySelectorAll('.card');
  if(data){
    cards.forEach(card=>{
      card.classList.add('has-orn');
      const img = card.querySelector('.orn-overlay img');
      if(img) img.src = data;
    });
  } else {
    cards.forEach(card=>card.classList.remove('has-orn'));
  }
}
applyOrnamentToMockups();

window.addEventListener('storage', e=>{
  if(e.key === 'taina_last_ornament') applyOrnamentToMockups();
});

/* ===== Toast ===== */
const toast = document.getElementById('toast');
let toastTimeout;
function showToast(msg){
  clearTimeout(toastTimeout);
  toast.innerHTML = msg;
  toast.classList.add('show');
  toastTimeout = setTimeout(()=>toast.classList.remove('show'), 5000);
}

/* ===== Копіювання/завантаження орнаменту ===== */
function downloadDataUrl(dataUrl, filename){
  const a = document.createElement('a');
  a.href = dataUrl; a.download = filename || 'taina_ornament.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
async function copyToClipboard(blob){
  try{
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    return true;
  }catch(e){ console.error('Clipboard copy failed', e); return false; }
}

/* ===== Копіювання орнаменту при кліку на посилання ===== */
document.querySelectorAll('.card-bottom .action-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    let ornamentData = null;
    try { ornamentData = localStorage.getItem('taina_last_ornament'); } catch(err){}

    // Якщо орнаменту немає — зупиняємо перехід і переправляємо в Лабораторію
    if (!ornamentData) {
      e.preventDefault();
      showToast("Спершу створіть та збережіть орнамент у <a href='index.html' style='color:var(--acc-hot)'>Лабораторії</a>.");
      setTimeout(() => { window.location.href = 'index.html'; }, 2500);
      return;
    }

    // Якщо орнамент є — браузер штатно відкриває Telegram,
    // а ми паралельно у фоні копіюємо картинку в буфер обміну
    fetch(ornamentData)
      .then(res => res.blob())
      .then(blob => copyToClipboard(blob))
      .catch(err => console.error("Помилка копіювання", err));
  });
});
</script>
</body>
</html>
