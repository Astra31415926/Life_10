/* ═══ ПОКАЗ МОЖЛИВОСТЕЙ (один раз при завантаженні) ═══
   Ніби хтось показує відвідувачу сайт: друкує фразу, перемикає режими,
   відкриває палітру й обирає кольори, вмикає негатив, міняє квадрати
   на кружечки. Фраза друкується напівпрозоро — щоб було видно, що це
   не текст користувача.
   Перша ж дія людини (дотик, клік, клавіша, прокрутка) зупиняє показ
   НАЗАВЖДИ, до перезавантаження сторінки: усе, що показ змінив,
   повертається як було, поле й холст порожні. Відтак ніщо не перекриває
   сканування і не з'являється саме по собі.
   Поки йде показ, «Зберегти» неактивна, нічого не зберігається. */
const PHRASES={uk:'Напиши що завгодно',en:'Write anything'};
let tourRun=0, tourDead=false, tourSaved=null;
const tw=ms=>new Promise(r=>setTimeout(r,ms));
function tourAlive(run){return run===tourRun&&!tourDead;}
function tourPick(gi,ii){palG=gi;palI=ii;buildSwatches();render();}
/* ПРОЖЕКТОР: екран темніє на 20%, світле коло перелітає туди, де
   зараз станеться дія, — і лише потім дія відбувається. Затемнення
   зроблене величезною тінню навколо кола (box-shadow), тому коло
   рухається плавно й не заважає клікам (pointer-events:none). */
const spot=document.createElement('div'); spot.id='spot'; document.body.appendChild(spot);
function spotTo(el,mode){
  if(!el)return; const r=el.getBoundingClientRect();
  const R=(mode==='cover')?Math.hypot(r.width,r.height)/2+6:Math.max(r.width,r.height)/2+14;
  spot.style.left=(r.left+r.width/2-R)+'px'; spot.style.top=(r.top+r.height/2-R)+'px';
  spot.style.width=spot.style.height=(2*R)+'px'; spot.classList.add('on');
}
function spotOff(){spot.classList.remove('on');}
function spotAt(cx,cy,R){spot.style.left=(cx-R)+'px';spot.style.top=(cy-R)+'px';spot.style.width=spot.style.height=(2*R)+'px';spot.classList.add('on');}
/* Коло на рядку, де друкується текст. Текст вирівняний по центру поля,
   тож коло стоїть у центрі й розкривається в міру того, як рядок росте. */
const _mctx=document.createElement('canvas').getContext('2d');
function spotText(){
  const el=$('txt'), r=el.getBoundingClientRect(), cs=getComputedStyle(el);
  const fs=parseFloat(cs.fontSize), lh=parseFloat(cs.lineHeight)||fs*1.4;
  _mctx.font=cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
  const w=Math.min(_mctx.measureText(el.value||'').width, r.width-40);
  const cy=r.top+parseFloat(cs.paddingTop)+lh/2;
  spotAt(r.left+r.width/2, cy, Math.max(lh/2+16, w/2+26));
}
/* Прибрати за собою: повернути все, що змінив показ, і очистити поле. */
function tourCleanup(){
  const t=tourSaved||{};
  tourPal(false);
  if(t.palG!=null){palG=t.palG;palI=t.palI;} motif=t.motif||'none'; motifK=t.motifK||4;
  shape=t.shape||'square'; syncSeg('shape','s',shape);
  invert=!!t.invert; syncInv();
  buildSwatches(); setLayers(t.layers===3?3:1);
  isDemo=false; document.body.classList.remove('ghost');
  D.single=''; $('txt').value=''; prevLen=0; build();
}
/* навести коло й дати оку долетіти, перш ніж щось перемкнеться */
async function look(el,mode,run){spotTo(el,mode);await tw(650);return tourAlive(run);}
function swatch(row,col){return [...$(row).children].find(d=>d.style.background&&rgbHex(d.style.background)===col);}
function rgbHex(c){const m=c.match(/\d+/g);return m?'#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join(''):c;}
function tourPal(open){palOpen=open;$('pal-panel').classList.toggle('hide',!open);$('pal-btn').classList.toggle('on',open);fitPal();}
async function tourPlay(){
  const run=++tourRun;
  tourSaved={palG,palI,shape,layers,invert,motif,motifK};
  isDemo=true; document.body.classList.add('ghost');
  const steps=[
    async()=>{                                   // 1. друкує фразу — коло на орнаменті
      spotText(); await tw(650); if(!tourAlive(run))return;   // коло там, де почнеться текст
      const ch=[...(PHRASES[LANG]||PHRASES.uk)];
      spot.classList.add('fast');
      for(let i=1;i<=ch.length;i++){
        if(!tourAlive(run)){spot.classList.remove('fast');return;}
        D.single=ch.slice(0,i).join(''); $('txt').value=D.single; build(); spotText();
        await tw(110+Math.random()*90);
      }
      spot.classList.remove('fast');
      await tw(1300);
    },
    async()=>{ if(!await look($('layers').children[1],'',run))return; setLayers(3); build(); await tw(1500); },  // 2. кольоровий
    async()=>{ if(!await look($('layers').children[0],'',run))return; setLayers(1); build(); await tw(800); },   //    монохром
    async()=>{ if(!await look($('pal-btn'),'',run))return; tourPal(true); await tw(600); },                    // 3. палітра
    async()=>{ if(!await look($('pl-list').children[0],'',run))return; tourPick(0,0); await tw(900); },          //    традиційні: червоно-чорна
    async()=>{ if(!await look($('pl-list').children[1],'',run))return; tourPick(0,1); await tw(1000); },         //    синьо-біла
    async()=>{ if(!await look($('mot-row').children[1],'',run))return; motif='rhomb'; buildMotifRow(); render(); await tw(1200); },  // мотив
    async()=>{ if(!await look($('mot-row').children[0],'',run))return; motif='none'; buildMotifRow(); render(); await tw(600); },
    async()=>{ if(!await look($('pal-btn'),'',run))return; tourPal(false); await tw(400); },
    async()=>{ if(!await look($('invBtn'),'',run))return; invert=true; syncInv(); build(); await tw(1500); },   // 4. негатив
    async()=>{ invert=false; syncInv(); build(); await tw(800); },                                              //    позитив
    async()=>{ if(!await look($('shape').children[1],'',run))return; shape='circle'; syncSeg('shape','s',shape); syncPalRows(); render(); await tw(1400); },  // 5. кружечки
    async()=>{ if(!await look($('shape').children[2],'',run))return; shape='cross'; syncSeg('shape','s',shape); syncPalRows(); render(); await tw(1600); },   //    хрестики
    async()=>{ if(!await look($('shape').children[0],'',run))return; shape='square'; syncSeg('shape','s',shape); syncPalRows(); render(); await tw(900); },   //    квадрати
    async()=>{ if(!await look($('stage'),'cover',run))return; await tw(900); },                              // погляд на результат
    async()=>{ if(!await look($('clr'),'',run))return;                                                        // 6. кошик прибирає за собою
               tourCleanup(); tone(320,.09,.06,'triangle'); await tw(900); },
    async()=>{ spotText(); await tw(800); if(!tourAlive(run))return;                                           // 7. місце — людині
               tourDead=true; spotOff();
               /* курсор у полі. На телефоні не фокусуємо: без дотику людини
                  клавіатура все одно не відкриється, а сторінку може смикнути. */
               if(matchMedia('(pointer:fine)').matches)$('txt').focus(); }
  ];
  for(const st of steps){ if(!tourAlive(run))return; await st(); }
  /* Показ завершився сам — результат лишається на екрані, доки людина
     щось не зробить. */
}
function tourStop(){
  if(tourDead)return;
  tourDead=true; tourRun++; spotOff(); spot.classList.remove('fast');
  if(!isDemo)return;
  tourCleanup();   /* повертаємо все, що змінив показ, і очищаємо поле */
}
/* Лише СПРАВЖНІ дії людини (isTrusted) — програмні кроки показу подій не шлють. */
['pointerdown','keydown','wheel','touchstart'].forEach(ev=>document.addEventListener(ev,e=>{
  if(!e.isTrusted)return;
  /* закриття вікна привітання («Проєкт») — не дія з сайтом, показ не зупиняємо */
  const m=document.getElementById('modal');
  if(m&&!m.classList.contains('hide')&&(m.contains(e.target)||e.key==='Escape'))return;
  tourStop();
},{capture:true,passive:true}));
function modalOpen(){const m=document.getElementById('modal');return !!(m&&!m.classList.contains('hide'));}

/* ═══ ПАМ'ЯТЬ ЛАБОРАТОРІЇ ═══
   Пішов у Галерею й повернувся — текст, режим, форма і кольори на місці.
   sessionStorage, а не localStorage: пам'ять живе рівно стільки, скільки
   відкрита вкладка. Нова вкладка починається з чистого аркуша.
   Демо не зберігаємо: це не робота користувача. */
const LAB_KEY='taina_lab_state';
function saveState(){
  if(isDemo)return;
  try{sessionStorage.setItem(LAB_KEY,JSON.stringify(
    {t:D.single,l:layers,sh:shape,pg:palG,pi:palI,inv:invert,
     mo:motif,mk:motifK,vt:volT,ft:fabT,fg:fabG,rs:rgbStep}));}catch(e){}
}
function restoreState(){
  let st=null;
  try{st=JSON.parse(sessionStorage.getItem(LAB_KEY)||'null');}catch(e){}
  if(!st||!st.t){setLayers(1);build();(function wait(){ if(tourDead||D.single)return;
      if(modalOpen())return setTimeout(wait,300);        /* спершу людина закриє «Проєкт» */
      setTimeout(()=>{if(!tourDead&&!D.single&&!modalOpen())tourPlay();else wait();},1200); })();return;}
  if(PALS[st.pg]&&PALS[st.pg].items[st.pi]){palG=+st.pg;palI=+st.pi;}
  invert=!!st.inv; syncInv();
  motif=MOTIFS.some(m=>m.k===st.mo)?st.mo:'none'; motifK=st.mk||4;
  if(st.vt!=null)volT=st.vt;
  rgbStep=((+st.rs||0)%8+8)%8; rgbDeg=rgbStep*45;
  fabT=+st.ft||0; fabG=(st.fg!=null)?+st.fg:35; $('fab').value=fabT; $('fabg').value=fabG; $('vol').value=volT;
  shape=(st.sh==='circle'||st.sh==='cross')?st.sh:'square'; syncSeg('shape','s',shape);
  buildSwatches();
  setLayers(st.l===3?3:1);
  tourDead=true;   /* людина вже працювала в цій вкладці — показ не потрібен */
  isDemo=false; D.single=st.t; $('txt').value=st.t; prevLen=st.t.length;
  autoGrow(); build(); pushHist();
}
$('txt').addEventListener('focus',()=>tourStop());
/* ═══ МЕЖА ДОВЖИНИ — У БАЙТАХ, однакова для обох режимів ═══
   Кирилиця — 2 байти на літеру, латиниця — 1, емодзі — 4. Режим можна
   перемикати будь-коли, тож межа рахується за найсуворішим — монохромом.
     до BYTE_SAFE — спокійно: камера читає навіть дрібний код;
     до BYTE_MAX  — зона ризику: попередження, але друкувати можна;
     BYTE_MAX     — стоп: далі не друкується. На цій довжині код ще
                    гарантовано читається з файлу (перевірено). */
/* Пороги виміряні імітацією камери (монохром, кирилиця):
     ≤50 Б — читається при будь-якому розмірі коду в кадрі, від 300 px;
     60 Б  — дрібний код (300 px) уже не читається;
     80–100 Б — лише великий код (~500–600 px у кадрі), і не завжди;
     100 Б — з файлу читається в усіх режимах і варіантах (перевірено 13 видів). */
const BYTE_SAFE=50, BYTE_MAX=100;
let byteZone='ok';
function bytesOf(t){return enc.encode(t).length;}
/* Вставка, що не влазить, обрізається по символах — і саме вставлене,
   а не те, що вже написано. Видаляти можна завжди. */
function fitBytes(old,nw){
  if(bytesOf(nw)<=BYTE_MAX||bytesOf(nw)<=bytesOf(old))return null;
  let pre=0; while(pre<old.length&&pre<nw.length&&old[pre]===nw[pre])pre++;
  if(pre>0&&/[\uD800-\uDBFF]/.test(nw[pre-1]))pre--;            // не рвати емодзі навпіл
  let suf=0; while(suf<old.length-pre&&suf<nw.length-pre&&old[old.length-1-suf]===nw[nw.length-1-suf])suf++;
  if(suf>0&&/[\uDC00-\uDFFF]/.test(nw[nw.length-suf]))suf--;
  const head=nw.slice(0,pre), tail=nw.slice(nw.length-suf), ins=nw.slice(pre,nw.length-suf);
  let room=BYTE_MAX-bytesOf(head+tail), out='';
  for(const ch of ins){const b=bytesOf(ch); if(b>room)break; out+=ch; room-=b;}
  return {value:head+out+tail, caret:(head+out).length};
}
function updateBytes(){
  const el=$('bytes'), f=$('txt'); if(!el)return;
  fitField();
  const b=bytesOf(f.value), zone=b>=BYTE_MAX?'max':(b>BYTE_SAFE?'warn':'ok');
  /* Порожньо, показ, або під полем уже стоїть результат скану — мовчимо. */
  const busyLine=$('rt')&&$('rt').textContent.trim();
  if(!b||isDemo||busyLine){el.textContent='';el.className='bytes';f.classList.remove('warn','max');byteZone=b?zone:'ok';return;}
  /* У спокійній зоні — ЖОДНОГО напису: те, що код читається, і так видно.
     Підпис з'являється лише тоді, коли є що сказати: наближається межа
     або її вичерпано. */
  if(zone==='ok'){el.textContent='';el.className='bytes';f.classList.remove('warn','max');byteZone='ok';return;}
  const msg=zone==='max'?t('bMax'):t('bWarn');
  el.textContent=msg+' · '+b+' / '+BYTE_MAX+' '+t('bUnit');
  el.className='bytes '+zone;
  f.classList.toggle('warn',zone==='warn'); f.classList.toggle('max',zone==='max');
  /* звуковий сигнал — лише в момент входу в нову зону */
  if(zone!==byteZone){ if(zone==='warn')tone(523,.12,.06,'triangle'); if(zone==='max')tone(330,.16,.07,'triangle'); }
  byteZone=zone;
}
function bumpField(){const f=$('txt');f.classList.remove('bump');void f.offsetWidth;f.classList.add('bump');tone(220,.1,.07,'square');}

$('txt').oninput=e=>{

<!-- ═══════════════════════════════════════════════════════════════════

     Вимкнено за замовчуванням. Коли увімкнено, «Зберегти» віддає не

     Розшифровка двох видів (перемикач):

       «Місце» — копія всього орнаменту, бліда, а червоним світяться
                  клітинки саме цієї літери: видно, де вона в коді живе.

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var PW=1000, SITE='taina-ten.vercel.app', RED=[214,22,27];
/* ФОН АРКУША = ПОЛЕ ДОВКОЛА КОДУ, а не окремий колір.
   Сканер шукає код по контрасту рамки з її власним полем; якщо поле
   замінити (скажімо, сірим), темне поле зникає — і читається сміття.
   Тож аркуш — це продовження того самого поля, з тією ж тканиною,
   а під нього підлаштовуються букви й адреса. */
var SHEET=[218,218,218], TEXT=[20,20,20], ADDR=[52,52,52];
function lumA3(a){return .299*a[0]+.587*a[1]+.114*a[2];}
function zoneCol(){
  var p=px(OFF,1,1);
  try{ if(BG_COLS.length){var flip=(rgbMask()===7),best=null,bd=1e9;
    BG_COLS.forEach(function(h){var a=hexRGB(h);if(flip)a=a.map(function(v){return 255-v;});
      var d=dist(a,p);if(d<bd){bd=d;best=a;}});
    if(best&&bd<120)return best.slice(0,3);} }catch(e){}
  return p;
}

/* ── налаштування (пам'ятаються в цьому браузері) ──
   Діапазони навмисно широкі, щоб кожен повзунок помітно щось міняв. */
var S={on:false,v:'A',orn:80,size:66,sp:26,gap1:100,gap2:34};
try{var sv=JSON.parse(localStorage.getItem('taina_sig2')||'null');if(sv)for(var k in S)if(k in sv)S[k]=sv[k];}catch(e){}
function keep(){try{localStorage.setItem('taina_sig2',JSON.stringify(S));}catch(e){}}

function px(c,x,y){return Array.prototype.slice.call(c.getContext('2d').getImageData(x,y,1,1).data,0,3);}
function dist(a,b){return Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]);}
function mix(a,b,t){return [0,1,2].map(function(i){return Math.round(a[i]+(b[i]-a[i])*t);});}
function css(a){return 'rgb('+a.join(',')+')';}
function hex2(h){h=String(h).replace('#','');return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16);});}

/* Кольори розшифровки — ТІ САМІ, що в орнаменті: одиниця = колір нитки,
   нуль = колір поля. Тож маленький знак — точна копія клітинок великого. */
function anyRGB(v){
  if(Array.isArray(v))return v.slice(0,3);
  v=String(v);var m=v.match(/\d+(\.\d+)?/g);
  if(v.indexOf('rgb')===0&&m)return [+m[0],+m[1],+m[2]];
  return hex2(v);
}
/* Колір одиниці й нуля беремо З САМОГО ОРНАМЕНТУ — з карти клітинок, за якою
   будується й схема для вишивки. Так знак завжди збігається з орнаментом:
   і в негативі, і в хрестику, де сайт розфарбовує по-своєму.
   Мотив фарбує лише частину клітинок, тож беремо найчастіший колір. */
function cellCols(){
  if(layers===3) return {one:hex2(rgbInk(1,1,1)), zero:hex2(rgbInk(0,0,0))};
  try{
    var n=CELLS.n,pd=CELLS.pad,t1={},t0={};
    for(var y=0;y<H;y++)for(var x=0;x<W;x++){
      var i=y*W+x, on=(grid.r&&grid.r[i])||(grid.g&&grid.g[i])||(grid.b&&grid.b[i]);
      var col=String(CELLS.col[(y+pd)*n+(x+pd)]), T=on?t1:t0; T[col]=(T[col]||0)+1;
    }
    var top=function(T){var b=null,bc=-1;for(var k in T)if(T[k]>bc){bc=T[k];b=k;}return b;};
    var o=top(t1),z=top(t0);
    if(o&&z&&o!==z)return {one:anyRGB(o),zero:anyRGB(z)};
  }catch(e){}
  var p=PAL(); return invert?{one:p.bg.slice(),zero:p.ink.slice()}:{one:p.ink.slice(),zero:p.bg.slice()};
}
/* Межа орнаменту: де закінчується світле поле довкола коду і починається рамка. */
function ornBox(){
  var bg=px(OFF,1,1), y=Math.floor(OFF.height/2), x0=0;
  for(var x=0;x<OFF.width/3;x++){if(dist(px(OFF,x,y),bg)>90){x0=x;break;}}
  return {x:x0,y:x0,w:OFF.width-2*x0};
}

function octGrid(t){
  var tb=textBits(t), n=pickN2('oct',tb.bits.length), bc=baseCells('oct',n), on={}, own={};
  for(var i=0;i<bc.length;i++){
    var ms=mirrors('oct',n,bc[i][0],bc[i][1]);
    for(var k=0;k<ms.length;k++){var key=ms[k][0]+','+ms[k][1];own[key]=i;if(i<tb.bits.length&&tb.bits[i])on[key]=1;}
  }
  return {n:n,on:on,own:own};
}

/* ── постер: ширина 1000, висота — скільки треба вмісту, без порожнечі ── */
/* ДРУК: той самий постер у X разів більший (X=3 → 3000 по ширині).
   Розкладка рахується в «екранних» одиницях, а малюється в пікселях ×X.
   Орнамент не розтягується, а перемальовується з цілою клітинкою. */
var SCALE=1;
function poster(opts){
  opts=opts||{}; var PRINT=!!opts.print, X=PRINT?3:1;
  var text=(D.single||'').replace(/\s+$/,''), chars=Array.from(text), k=chars.length;
  var useRow=(S.v!=='none')&&k>0&&k<=12;
  var FAM='Inter, "Helvetica Neue", Arial, sans-serif';
  var OW=Math.round(PW*S.orn/100), TOP=90, BOT=80, PO=null;
  if(PRINT){
    /* рамка орнаменту має займати рівно ціле число клітинок × ціле число пікселів */
    PO=printOrn({framePx:OW*X});
    OW=PO.framePx/X;
  }
  var ox=(PW-OW)/2;
  var tmp=document.createElement('canvas').getContext('2d');
  /* розкладка */
  var gap=0,m=0,fs=S.size,lines=[],ls=0,h=TOP+OW;
  if(useRow){
    gap=Math.min(S.sp,(OW/k)*0.45);
    m=(OW-gap*(k-1))/k;
    fs=Math.min(S.size,m*0.95);
    h+=S.gap1+fs+fs*0.6+m;
  }else if(k){
    ls=fs*0.35;tmp.font='700 '+fs+'px '+FAM;
    lines=wrap(tmp,text.toUpperCase(),OW,ls,fs,FAM);fs=lines.fs;ls=lines.ls;
    h+=S.gap1+lines.length*fs*1.3-fs*0.3;
  }
  var AS=34; h+=PRINT?BOT:(S.gap2+AS+BOT);   /* у друку адреси немає */
  /* телефонний Safari не тягне сторону понад 4096 — тоді трохи менший масштаб */
  if(PRINT&&h*X>4096){X=Math.floor(4096/h*100)/100;PO=printOrn({framePx:Math.round(PW*S.orn/100)*X});OW=PO.framePx/X;ox=(PW-OW)/2;}

  SHEET=zoneCol();
  var dark=lumA3(SHEET)<128;
  /* ІМ'Я Й АДРЕСА — найконтрастніший до тла колір (з кольорів орнаменту,
     чорного й білого). РОЗШИФРОВКА — спокійний відтінок, що вже є в
     орнаменті (скажімо, жовтий мотив): видно, але з ім'ям не сперечається. */
  var TONES=sigTones(); TEXT=TONES.text; ADDR=TONES.text; ACC=TONES.acc;
  var c=document.createElement('canvas');c.width=Math.round(PW*X);c.height=Math.round(h*X);
  var g=c.getContext('2d');g.fillStyle=css(SHEET);g.fillRect(0,0,c.width,c.height);
  g.imageSmoothingEnabled=false;
  /* та сама тканина, що й на полі коду (у друку — з тим самим кроком відносно клітинки) */
  try{withFabricScale(X,function(){applyFabric(g,c.width,c.height,rgbMask()===7);});}catch(e){}
  /* орнамент ЦІЛИМ, разом зі своїм полем: рамка завширшки OW, поле довкола
     зливається з аркушем */
  if(PRINT){
    /* піксель у піксель, без масштабу: рамка стає на цілу координату */
    var px0=Math.round(ox*X), py0=Math.round(TOP*X);
    g.drawImage(PO.canvas,px0-PO.qzPx,py0-PO.qzPx);
    c.orn={x:px0,y:py0,w:PO.framePx};
  }else{
    var B=ornBox(), k2=OW/B.w;
    g.drawImage(OFF,Math.round(ox-B.x*k2),Math.round(TOP-B.y*k2),Math.round(OFF.width*k2),Math.round(OFF.height*k2));
    c.orn={x:ox,y:TOP,w:OW};
  }
  /* решта — у «екранних» одиницях; клітинки знаків пригвинчуються до пікселів */
  g.setTransform(X,0,0,X,0,0); SCALE=X;
  var y=TOP+OW;
  g.fillStyle=css(TEXT);g.textBaseline='top';
  if(useRow){
    y+=S.gap1;g.font='700 '+fs+'px '+FAM;g.textAlign='center';
    chars.forEach(function(ch,i){g.fillText(ch.toUpperCase(),ox+i*(m+gap)+m/2,y);});
    y+=fs+fs*0.6;
    if(S.v==='A')rowA(g,chars,ox,y,m,gap);else rowB(g,text,chars,ox,y,m,gap);
    y+=m;
  }else if(k){
    y+=S.gap1;g.font='700 '+fs+'px '+FAM;
    lines.forEach(function(L,i){drawSpaced(g,L,PW/2,y,ls);y+=fs*1.3;});y-=fs*0.3;
  }
  if(!PRINT){
    y+=S.gap2;
    g.fillStyle=css(ADDR);g.font='500 '+AS+'px '+FAM;g.textAlign='center';g.textBaseline='top';
    g.fillText(SITE,PW/2,y);
  }
  g.setTransform(1,0,0,1,0,0); SCALE=1;
  return c;
}
function cellRect(g,x0,y0,cs,p){
  var X=SCALE;
  var x=Math.round((x0+p[0]*cs)*X),yy=Math.round((y0+p[1]*cs)*X);
  var x2=Math.round((x0+(+p[0]+1)*cs)*X),y2=Math.round((y0+(+p[1]+1)*cs)*X);
  if(X!==1){g.save();g.setTransform(1,0,0,1,0,0);g.fillRect(x,yy,x2-x,y2-yy);g.restore();}
  else g.fillRect(x,yy,x2-x,y2-yy);
}
/* ── тони підпису ─────────────────────────────────────────────────
   Контраст рахуємо за правилом WCAG (відношення яскравостей). */
var ACC=[120,120,120];
function relL(a){return [0,1,2].map(function(i){var v=a[i]/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);})
  .reduce(function(s,v,i){return s+v*[.2126,.7152,.0722][i];},0);}
function contrast(a,b){var x=relL(a),y=relL(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function ornColors(){
  var out=[],seen={};
  try{CELLS.col.forEach(function(v){var k=String(v);if(seen[k])return;seen[k]=1;out.push(anyRGB(v));});}catch(e){}
  return out;
}
function sigTones(){
  var cols=ornColors();
  /* ім'я: найбільший контраст до тла серед кольорів орнаменту, чорного й білого */
  var cand=cols.concat([[0,0,0],[255,255,255]]), text=cand[0], best=-1;
  cand.forEach(function(c){var k=contrast(c,SHEET);if(k>best){best=k;text=c;}});
  /* розшифровка: колір з орнаменту, помітний на тлі, але найспокійніший —
     не тло і не колір імені */
  var acc=null, ak=1e9;
  cols.forEach(function(c){
    var k=contrast(c,SHEET);
    if(dist(c,SHEET)<60||dist(c,text)<90||k<1.35)return;
    if(k<ak){ak=k;acc=c;}
  });
  if(!acc)acc=mix(text,SHEET,.55);
  return {text:text,acc:acc};
}

/* ── МІНІ-ОРНАМЕНТ З РАМКОЮ Й ЗЕБРОЮ ─────────────────────────────────
   Та сама будова, що в генераторі: темне кільце, світле кільце, кільце
   зебри, далі поле даних. «Темне» — колір розшифровки, «світле» — тло
   аркуша, тож знак лягає на аркуш спокійно, без своєї плашки. */
function miniFrame(g,x0,y0,size,n,ink,cellFn){
  var CW=n+6, cs=size/CW;
  var put=function(cx,cy,col){if(!col)return;g.fillStyle=css(col);cellRect(g,x0,y0,cs,[cx,cy]);};
  for(var x=0;x<CW;x++){put(x,0,ink);put(x,CW-1,ink);}
  for(var yy=1;yy<CW-1;yy++){put(0,yy,ink);put(CW-1,yy,ink);}
  for(x=2;x<CW-2;x++){if(x%2===0)put(x,2,ink);if((x+CW-3)%2===0)put(x,CW-3,ink);}
  for(yy=3;yy<CW-3;yy++){if(yy%2===0)put(2,yy,ink);if((CW-3+yy)%2===0)put(CW-3,yy,ink);}
  for(var key in cellFn.own){var p=key.split(',');put(+p[0]+3,+p[1]+3,cellFn.col(key));}
}
/* «Знаки»: кожна літера — свій повний код */
function rowA(g,chars,ox,y,m,gap){
  chars.forEach(function(ch,i){
    if(/\s/.test(ch))return;
    var G=octGrid(ch);
    miniFrame(g,ox+i*(m+gap),y,m,G.n,ACC,{own:G.own,col:function(k){return G.on[k]?ACC:null;}});
  });
}
/* «Місце»: увесь код у кожному знаку; одиниці цієї літери — яскраві,
   решта — приглушені */
function rowB(g,text,chars,ox,y,m,gap){
  var G=octGrid(text), start=0;
  var hot=(contrast(RED,SHEET)>=2.2&&dist(RED,ACC)>120)?RED:TEXT, dim=mix(ACC,SHEET,.55);
  chars.forEach(function(ch,i){
    var lo=start,hi=start+new TextEncoder().encode(ch).length*8;start=hi;
    miniFrame(g,ox+i*(m+gap),y,m,G.n,ACC,{own:G.own,col:function(k){
      if(!G.on[k])return null; var idx=G.own[k]; return (idx>=lo&&idx<hi)?hot:dim;}});
  });
}
function spacedW(g,s,ls){return g.measureText(s).width+ls*Math.max(Array.from(s).length-1,0);}
function drawSpaced(g,s,cx,y,ls){
  var w=spacedW(g,s,ls),x=cx-w/2;g.textAlign='left';
  Array.from(s).forEach(function(ch){g.fillText(ch,x,y);x+=g.measureText(ch).width+ls;});
}
function wrap(g,s,W,ls,fs,FAM){
  var lines;
  for(var t=0;t<25;t++){
    g.font='700 '+fs+'px '+FAM;
    var words=s.split(/\s+/),cur='';lines=[];
    words.forEach(function(w){var q=cur?cur+' '+w:w;if(spacedW(g,q,ls)<=W||!cur)cur=q;else{lines.push(cur);cur=w;}});
    if(cur)lines.push(cur);
    if(lines.length<=3&&lines.every(function(L){return spacedW(g,L,ls)<=W;}))break;
    fs=Math.round(fs*0.92);ls*=0.92;
  }
  lines.fs=fs;lines.ls=ls;return lines;
}
/* ═══ ДРУК: орнамент заново, з великою ЦІЛОЮ клітинкою ═══
   Не розтягуємо екранний холст (краї клітинок розмились би), а малюємо
   тим самим кодом сайту, лише з більшою клітинкою. Усі товщини, стібки,
   кружечки рахуються від клітинки самі. Крок тканини множимо на те саме
   відношення, щоб плетення лишилось таким, як на екрані.
   side — повна сторона в клітинках (поле + рамка + дані).
   Безпечна межа для телефону: сторона ≤ 4096. */
function geomNow(){
  var QZ=2, pad=(frameW>=2?3:frameW), tw=W+pad*2, th=H+pad*2;
  var side=Math.max(tw+QZ*2,th+QZ*2);
  return {QZ:QZ,pad:pad,tw:tw,th:th,side:side,screenCell:Math.max(3,2*Math.floor(1161/side/2)+1)};
}
function withFabricScale(r,fn){
  var orig=window.fabricMap;
  if(r!==1&&typeof orig==='function')window.fabricMap=function(a,b,p){return orig(a,b,Math.max(2,Math.round(p*r)));};
  try{return fn();}finally{window.fabricMap=orig;}
}
function printOrn(o){
  var G=geomNow(), cell;
  if(o&&o.framePx) cell=Math.max(1,Math.floor(o.framePx/G.tw));      /* для постера: рамка ≈ задана ширина */
  else cell=Math.max(1,Math.floor(3600/G.side));                     /* чистий квадрат ≈ 3600 */
  while(cell>1&&cell*G.side>4096)cell--;
  var cv=document.createElement('canvas');
  cv.width=(G.tw+G.QZ*2)*cell; cv.height=(G.th+G.QZ*2)*cell;
  var ctx=cv.getContext('2d',{willReadFrequently:true}); ctx.imageSmoothingEnabled=false;
  try{
    paint(ctx,cell,G.pad,G.QZ);
    if(rgbMask()===7){var d=ctx.getImageData(0,0,cv.width,cv.height),a=d.data;
      for(var i=0;i<a.length;i+=4){a[i]=255-a[i];a[i+1]=255-a[i+1];a[i+2]=255-a[i+2];}ctx.putImageData(d,0,0);}
    if(STITCH_LIST.length)drawStitches(ctx,cell,rgbMask()===7);
    withFabricScale(cell/G.screenCell,function(){applyFabric(ctx,cv.width,cv.height,rgbMask()===7);});
  }finally{
    /* paint() переписує службові списки (стібки, кольори тканини) під свою
       клітинку — повертаємо екранні, щоб нічого на сторінці не змінилось */
    render();
  }
  return {canvas:cv,cell:cell,framePx:cell*G.tw,qzPx:cell*G.QZ};
}
/* Один вхід для всіх кнопок збереження.
   kind: 'web' — як було; 'print' — висока роздільність, без адреси сайту. */
function saveImage(base,kind){
  var name=(base||'taina')+(kind==='print'?'_print':'_web');
  var cv;
  if(S.on) cv=poster({print:kind==='print'});
  else if(kind==='print') cv=printOrn().canvas;
  else cv=OFF;
  cv.toBlob(function(b){dlBlob(b,name+'.png');if(typeof tone==='function')tone(660,.09,.07);},'image/png');
}

/* Збереження ОДРАЗУ в момент натискання, без відкладених кроків:
   інакше браузер вважає завантаження «не від людини» і мовчки його блокує. */
function download(name){
  var url=poster().toDataURL('image/png'), a=document.createElement('a');
  a.href=url;a.download=(name||'taina')+'.png';a.style.display='none';
  document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},500);
  if(typeof tone==='function')tone(660,.09,.07);
}

/* ── панель керування ── */
var P=document.createElement('div');P.className='sig';P.id='sig-panel';
P.innerHTML=
  '<div class="sig-row"><span>Підпис<small>вертикальна картинка для Пінтересту</small></span>'+
    '<button type="button" class="sig-sw" id="sig-sw" aria-label="Підпис"></button></div>'+
  '<div class="sig-body" id="sig-body">'+
    '<div class="sig-seg" id="sig-v">'+
      '<button type="button" data-v="none">Без</button>'+
      '<button type="button" data-v="A">Знаки</button>'+
      '<button type="button" data-v="B">Місце</button></div>'+
    sl('orn','Розмір орнаменту',55,94)+sl('size','Розмір букв',30,120)+sl('sp','Розрядка',0,80)+
    sl('gap1','Від орнаменту до букв',10,300)+sl('gap2','Від знаків до адреси',6,240)+
    '<img class="sig-pv" id="sig-pv" alt="Попередній перегляд">'+
    '<div class="sig-two"><button type="button" class="sig-dl" id="sig-dl">⤓ Для соцмереж</button>'+
    '<button type="button" class="sig-dl alt" id="sig-dl-print">⤓ Для друку</button></div>'+
    '<button type="button" class="sig-reset" id="sig-reset">повернути як було</button>'+
  '</div>';
var UNIT={orn:'%'};
var DEF={orn:80,size:66,sp:26,gap1:100,gap2:34};
function sl(k,t,a,b){return '<label class="sig-sl"><span class="h"><span>'+t+'</span><b id="sig-'+k+'-v"></b></span>'+
  '<input type="range" id="sig-'+k+'" min="'+a+'" max="'+b+'"></label>';}
var big=document.createElement('div');big.className='sig-big';big.hidden=true;big.innerHTML='<img alt="">';
document.body.appendChild(big);big.onclick=function(){big.hidden=true;};

function sync(){
  $('sig-sw').classList.toggle('on',S.on);
  $('sig-body').hidden=!S.on;
  Array.prototype.forEach.call($('sig-v').children,function(b){b.classList.toggle('on',b.dataset.v===S.v);});
  Object.keys(DEF).forEach(function(k){$('sig-'+k).value=S[k];$('sig-'+k+'-v').textContent=S[k]+(UNIT[k]||'');});
  refresh();
}
var tmr=0;
function refresh(){
  if(!S.on||!hasImage)return;
  clearTimeout(tmr);tmr=setTimeout(function(){
    try{var c=poster();$('sig-pv').src=c.toDataURL('image/png');}catch(e){console.warn(e);}
  },120);
}
P.addEventListener('click',function(e){
  if(e.target.id==='sig-sw'){S.on=!S.on;keep();sync();return;}
  var b=e.target.closest('#sig-v button');if(b){S.v=b.dataset.v;keep();sync();return;}
  if(e.target.id==='sig-pv'){big.querySelector('img').src=e.target.src;big.hidden=false;}
  if(e.target.id==='sig-dl'||e.target.id==='sig-dl-print'){if(!hasImage||isDemo){toast('Спершу напиши щось');return;}
    saveImage(defaultName(),e.target.id==='sig-dl'?'web':'print');}
  if(e.target.id==='sig-reset'){for(var d in DEF)S[d]=DEF[d];keep();sync();}
});
P.addEventListener('input',function(e){
  var k=e.target.id&&e.target.id.replace('sig-','');if(!(k in DEF))return;
  S[k]=+e.target.value;keep();$('sig-'+k+'-v').textContent=S[k]+(UNIT[k]||'');refresh();
});
document.body.appendChild(P);P.hidden=true;   /* поки не вставлено на місце */

/* ── збереження: увімкнено — віддаємо постер ── */
var _save=window.savePNG;
window.savePNG=function(name){ if(!S.on) return _save(name); download(name); };
window.saveImage=saveImage;
/* орнамент змінився — оновлюємо попередній перегляд */
var _render=window.render;
window.render=function(){var r=_render.apply(this,arguments);refresh();return r;};
/* ПК: панель у меню збереження */
var _open=window.openMenu;
window.openMenu=function(){_open.apply(this,arguments);
  if(hasImage&&!matchMedia('(max-width:820px)').matches){$('menu').appendChild(P);P.hidden=false;refresh();fitMenu();}};
/* меню росте вгору — не даємо йому залізти під шапку сайту */
function fitMenu(){var m=$('menu');if(!m||m.classList.contains('hide')||!m.contains(P))return;
  m.style.maxHeight='none';
  var hdr=document.querySelector('header'), top=hdr?hdr.getBoundingClientRect().bottom+10:10;
  m.style.maxHeight=Math.max(220,m.getBoundingClientRect().bottom-top)+'px';}
P.addEventListener('click',function(){setTimeout(fitMenu,0);});

window.TainaSig={panel:P,poster:poster,settings:S,refresh:refresh,printOrn:printOrn,saveImage:saveImage};
sync();
})();
</script>

<!-- ═══════════════════════════════════════════════════════════════════
     МОБІЛЬНА ОБОЛОНКА v2
     Один самостійний блок у кінці файлу. Нічого вище не переписує:
     на телефоні ховає стару розкладку й будує нову, ПЕРЕНОСЯЧИ в неї
     ті самі елементи — тож усі обробники й функції лишаються ті самі.
     На ПК не робить нічого. Прибрати = вилучити цей блок.

     Будова: шапка (меню · TAINA · тема) → поле вводу → орнамент,
     притиснутий до поля → смуга з п'яти кнопок. Кожна кнопка висуває
     шухляду знизу; орнамент при цьому меншає, але лишається видимим
     цілком. Шухляда згортається тільки стрілкою біля назви.
     ═══════════════════════════════════════════════════════════════════ -->
<style>
@media(max-width:820px){
  /* ── гасимо стару розкладку ── */
  #hdr,#mobabar,.app>.cell,.rightcol,.inscan{display:none!important}
  .a-center .action,.a-center .btn-main{display:none!important}
  .app{display:flex!important;flex-direction:column;padding-bottom:0!important;
       grid-template-areas:none!important}
  .txtzone{padding:6px 12px 2px!important;max-width:none}
  .stagewrap{flex:1 1 auto;min-height:0;position:relative;display:block!important;padding:0!important}
  .stagebox{max-width:none!important}
  .stage{width:100%;height:100%}

  /* ── шапка ── */
  .m-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:6px 12px 2px}
  .m-top .m-ico{width:38px;height:38px;border:0;background:transparent;color:var(--muted);
    display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;padding:0}
  .m-top .m-ico svg{width:20px;height:20px}
  .m-top .m-brand{display:flex;align-items:center;color:var(--parchment);text-decoration:none;padding:4px 2px}
  .m-top .m-brand svg{height:17px;width:auto;display:block}   /* 4 модулі × 4,25px */
  body.light-mode .m-top .m-ico{color:var(--parchment)}

  /* ── хрестик у полі вводу (сюди переїжджає кошик) ── */
  .inbox-x{position:absolute!important;right:6px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;border-radius:10px;background:transparent;border:0;
    display:flex!important;align-items:center;justify-content:center;z-index:3;
    color:var(--muted);cursor:pointer;padding:0;bottom:auto!important;left:auto!important}
  .inbox-x svg{width:18px;height:18px}
  /* Поле порожнє — лише курсор посередині й ледь помітне «пиши».
     Відступи однакові з обох боків, тому текст росте рівно від центру. */
  textarea.inp.big{padding-left:48px!important;padding-right:48px!important;text-align:center}
  .inp::placeholder{color:var(--muted);opacity:.38}
  #cta-hint{display:none!important}

  /* «цей код читається» — окремим рядком ПІД орнаментом, нічого не закриває */
  /* Рядок завжди займає ОДНЕ й те саме місце — порожній він чи ні.
     Інакше напис з'являвся й зникав, і орнамент щоразу смикався. */
  #rt,#rt:empty{display:block!important;position:static!important;transform:none!important;
    left:auto!important;top:auto!important;flex:0 0 auto;background:transparent!important;
    padding:0 12px!important;border-radius:0!important;z-index:auto;text-align:center;
    height:22px!important;min-height:22px!important;max-height:22px;line-height:22px;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px}
  #rt .linkbtn{padding:1px 10px;font-size:11px}

  /* ВІСІМ КОЛІРНИХ СХЕМ — кубики 2×2 під номерами, два ряди по чотири */
  .m-rgb{display:none;grid-template-columns:repeat(4,1fr);gap:10px 8px;padding-top:4px}
  body.room-rgb .m-rgb{display:grid}
  .m-rgb button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0 3px;
    border:1.5px solid transparent;border-radius:12px;background:transparent;cursor:pointer;
    font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted)}
  .m-rgb .cube{width:54px;height:54px;border-radius:9px;display:grid;grid-template-columns:1fr 1fr;
    gap:7px;padding:8px;box-sizing:border-box;border:1px solid var(--line)}

$('m-menu').onclick=function(){toggle('menu');};
$('m-close').onclick=closeSheet;

/* ── 8. ВІДКРИТТЯ / ЗГОРТАННЯ ─────────────────────────────────── */
var TT={color:'Колір',form:'Форма',syms:'Знаки',save:'Зберегти й поділитися',menu:'Меню сайту'};
var cur=null;
function sheetH(){return Math.round(Math.max(190,Math.min(310,innerHeight*0.40)));}
function toggle(k){ if(cur===k){closeSheet();return;} openPane(k); }
function openPane(k){
  cur=k;
  $('m-title').textContent=TT[k]||'';
  sheet.querySelectorAll('.m-pane').forEach(function(p){
    p.classList.toggle('on',p.getAttribute('data-p')===k);});
  sheet.style.height=sheetH()+'px';
  sheet.style.bottom=bar.offsetHeight+'px';
  sheet.classList.add('on');
  bar.querySelectorAll('button').forEach(function(b){
    b.classList.toggle('on',b.getAttribute('data-p')===k);});
  requestAnimationFrame(layout);
}
function closeSheet(){
  cur=null;sheet.classList.remove('on');
  bar.querySelectorAll('button').forEach(function(b){b.classList.remove('on');});
  requestAnimationFrame(layout);
}

/* ── 9. РОЗМІР ОРНАМЕНТА: ніколи не ховається за шухлядою ──────── */
function layout(){
  var sh=cur?sheet.offsetHeight:0;
  slot.style.bottom=(sh+6)+'px';
  var h=wrap.clientHeight-sh-6, w=slot.clientWidth;
  var s=Math.max(110,Math.min(w,h));
  box.style.width=s+'px';box.style.height=s+'px';
}
addEventListener('resize',function(){
  if(cur){sheet.style.height=sheetH()+'px';sheet.style.bottom=bar.offsetHeight+'px';}
  layout();});
$('txt').addEventListener('input',function(){setTimeout(layout,0);});
setTimeout(layout,60);setTimeout(layout,400);

/* ── 10. МОТИВИ — простими знаками, без кольору ────────────────── */
var MSIGN={none:'<path d="M6 12h12"/>',
  rhomb:'<path d="M12 4 20 12 12 20 4 12z"/>',
  square:'<rect x="4.5" y="4.5" width="15" height="15"/><rect x="8.5" y="8.5" width="7" height="7"/>',
  medal:'<circle cx="12" cy="12" r="7.6"/><circle cx="12" cy="12" r="3.4"/>',
  cross:'<path d="M5 5l14 14M19 5L5 19"/>',
  plus:'<path d="M12 4.5v15M4.5 12h15"/>'};
window.buildMotifRow=function(){
  var b2=$('mot-row');if(!b2)return;b2.innerHTML='';
  var bw=!!PAL().mono;        /* у чорно-білій мотив неможливий */
  MOTIFS.forEach(function(m){
    var b=document.createElement('button');b.type='button';
    b.className='motb'+(m.k===motif?' on':'')+((bw&&m.f)?' off':'');
    b.innerHTML='<span class="msign">'+SV(MSIGN[m.k],1.7)+'</span><span>'+
                (LANG==='en'?m.en:m.uk)+'</span>';
    b.onclick=function(){motif=m.k;buildMotifRow();render();readStatus(true);saveState();tone(700,.05,.05);};
    b2.appendChild(b);});
};
/* ── 11. КОЛЬОРИ — просто смуги: дві без мотиву, чотири з мотивом ── */
window.buildSwatches=function(){
  var list=$('pl-list');if(!list)return;list.innerHTML='';
  PALS.forEach(function(g,gi){g.items.forEach(function(p,ii){
    var b=document.createElement('button');b.type='button';
    b.className='plbtn'+(gi===palG&&ii===palI?' on':'');
    var showM=(motif!=='none')&&!p.mono;
    var cols=invert?[p.ink,p.bg]:[p.bg,p.ink];
    if(showM)cols=invert?[p.ink,p.bg,p.ai,p.ab]:[p.bg,p.ink,p.ab,p.ai];
    b.innerHTML='<span class="plchips">'+cols.map(function(c){
      return '<i style="background:rgb('+c+')"></i>';}).join('')+'</span><span>'+
      (LANG==='en'?p.en:p.uk)+'</span>';
    b.onclick=function(){palG=gi;palI=ii;
      if(p.mono)motif='none';                /* ч/б — без мотиву */
      buildSwatches();render();readStatus(true);saveState();tone(760,.05,.05);};
    list.appendChild(b);});});
  var e=$('vol');if(e)e.value=volT;
  buildMotifRow();
};
buildSwatches();

/* ── 11б. ПОКАЗ МОЖЛИВОСТЕЙ вимкнено на телефоні ───────────────
   Він підсвічував кнопки лівої й правої колонок, а їх тут немає:
   прожектор стрибав би в порожнечу. Замість нього — підказка в полі. */
tourDead=true;
function ph(){$('txt').placeholder=(LANG==='en')?'type':'пиши';}
var _al=window.applyLang;
window.applyLang=function(){_al();ph();};
ph();

/* ── 12. КУБИК: повний цикл без повторів ───────────────────────── */
var deck=[],di=0;
function buildDeck(){
  deck=[];
  PALS.forEach(function(g,gi){g.items.forEach(function(p,ii){
    MOTIFS.forEach(function(m){
      if(p.mono&&m.f)return;                 /* ч/б без мотиву */
      [false,true].forEach(function(nv){deck.push({c:0,gi:gi,ii:ii,m:m.k,nv:nv});});
    });});});
  for(var s=0;s<8;s++)deck.push({c:1,s:s});
  for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
    var t=deck[i];deck[i]=deck[j];deck[j]=t;}
  /* Чорно-білу відсуваємо в САМИЙ КІНЕЦЬ: сайт і так стартує з неї,
     тож перший кидок має дати колір, а ч/б замикає коло. */
  var isBW=function(v){return !v.c&&PALS[v.gi].items[v.ii].mono;};
  deck=deck.filter(function(v){return !isBW(v);}).concat(deck.filter(isBW));
  di=0;
}
function diceCycle(){
  if(di>=deck.length)buildDeck();
  var v=deck[di++];
  if(v.c){setLayers(3);rgbStep=v.s;rgbDeg=v.s*45;}
  else{setLayers(1);palG=v.gi;palI=v.ii;motif=v.m;motifK=4;invert=v.nv;buildSwatches();}
  syncInv();scannedImg=null;build();readStatus(true);saveState();
  if(typeof diceSound==='function')diceSound();
  if(cur==='color')buildSwatches();
  buildRgb();
  toast(di+' / '+deck.length);
}
buildDeck();

})();
</script>
</body>
