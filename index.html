<link rel="stylesheet" href="shell.css">
<script defer src="shell.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--parchment);font-family:var(--sans);line-height:1.5;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,color-mix(in srgb,var(--acc) 8%,transparent),transparent);
  display:flex;flex-direction:column;min-height:100vh;transition:background-image .5s}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc-hot);outline-offset:2px}
.hide{display:none!important}

/* ═══════════════ СІТКА: 3 колонки на ПК ═══════════════ */
.app{flex:1 1 auto;display:grid;width:100%;max-width:1660px;margin:0 auto;
  grid-template-columns:330px minmax(0,1fr) 340px;
  grid-template-rows:auto auto 1fr;
  grid-template-areas:
    "mode center shape"
    "pal  center shape"
    "stat center syms";}
/* Палітра щільно під режимами: рядки лівої колонки більше не залежать
   від висоти правої. */
@media(min-width:821px){.cell.a-mode{padding-bottom:10px}.cell.a-pal{padding-top:0}}
.cell{padding:20px 24px;min-width:0}
.a-mode{grid-area:mode;border-right:1px solid var(--line)}
.a-pal{grid-area:pal;border-right:1px solid var(--line)}
.a-stat{grid-area:stat;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end}
.a-center{grid-area:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 22px 18px;min-width:0}
.a-shape{grid-area:shape;border-left:1px solid var(--line)}
.a-syms{grid-area:syms;border-left:1px solid var(--line);min-height:0;overflow:hidden}

.sec-t{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--acc-dim);text-transform:uppercase;
  display:flex;align-items:center;gap:8px;margin-bottom:11px}
.sec-t::before{content:'';width:5px;height:5px;background:var(--acc);flex:0 0 auto;transition:background .4s}

/* ═══════════════ ПОЛЕ ВВОДУ ═══════════════ */
.txtzone{width:100%;max-width:680px;display:flex;flex-direction:column;gap:6px}
.inp{width:100%;min-width:0;display:block;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;color:var(--parchment);font-family:var(--mono);outline:none;
  font-size:16px;letter-spacing:.03em;line-height:1.4;cursor:text;box-sizing:border-box}
/* ПОЛЕ, ЩО РОЗКРИВАЄТЬСЯ. Місце в розкладці (.inwrap) фіксоване — ОДИН рядок,
   тому холст ніколи не зрушує. Саме поле лежить поверх (.inbox, absolute)
   і росте вниз рівно під стільки тексту, скільки є, — за потреби
   наїжджаючи на орнамент. Мало тексту — один рядок, орнамент відкритий.
   Межа — 60% висоти екрана, далі повзунок. */
.inwrap{position:relative;width:100%;font-size:clamp(17px,2vw,22px);height:calc(1.4em + 32px)}
.inbox{position:absolute;left:0;right:0;top:0;z-index:35}
textarea.inp.big{font-size:clamp(17px,2vw,22px);text-align:center;padding:15px 20px;resize:none;
  overflow-y:auto;height:calc(1.4em + 32px);min-height:0;max-height:60vh;
  box-shadow:0 10px 30px rgba(0,0,0,.0);transition:box-shadow .2s}
textarea.inp.big.tall{box-shadow:0 14px 34px rgba(0,0,0,.45)}
.inp:focus{border-color:var(--acc);box-shadow:0 0 22px color-mix(in srgb,var(--acc) 18%,transparent)}
.inp::placeholder{color:var(--acc-dim)}
.rt{font-family:var(--mono);font-size:13px;min-height:0;text-align:center;display:flex;align-items:center;
  justify-content:center;gap:10px;flex-wrap:wrap}
.rt .g{color:var(--ok);font-weight:600}.rt .r{color:var(--bad);font-weight:600}
.rt .w{color:#e5a053;font-weight:600}
#dbg{font-size:11px;line-height:1.5;letter-spacing:.04em;color:var(--acc-dim);min-height:0;
  white-space:pre-wrap;word-break:break-word;max-width:100%;text-align:center}
/* Під полем показуємо тільки «прочитано» / «код не розпізнано»
   і кнопку «Відкрити» для посилань. Технічний журнал сканера прибрано.
   Висота рядка зарезервована, щоб поява кнопки не штовхала холст. */
#dbg{display:none!important}
#rt{min-height:40px}
#dbg .bad{color:var(--bad)} #dbg .ok{color:var(--ok)} #dbg .w{color:#e5a053}
.linkbtn{font-family:var(--mono);font-size:12px;font-weight:700;padding:8px 14px;border-radius:8px;
  border:1px solid var(--acc);color:var(--on-acc);background:var(--acc);cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;transition:.15s}

/* ═══════════════ ХОЛСТ ЗІ СТРІЛКАМИ І КОШИКОМ ═══════════════ */
.stagewrap{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
.spacer{display:none}
/* Кутові кнопки: мова ліворуч, тема праворуч, обидві на рівні
   верхнього краю холста. */
.cornbtn{position:absolute;top:0;left:50%;transform:translateX(-50%);width:48px;height:48px;border:0;
  background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:14px;font-weight:700;transition:.15s;line-height:1}
.cornbtn:hover{color:var(--acc-hot)}
.cornbtn.theme{color:var(--acc)}
.cornbtn.theme svg{width:27px;height:27px}
.arrow{width:48px;height:48px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);background:transparent;
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.arrow svg{width:22px;height:22px}
.arrow:hover:not(:disabled){color:var(--acc-hot);border-color:var(--acc-dim)}
.arrow:disabled{opacity:.28;cursor:default}
.stagebox{position:relative;width:100%;max-width:min(52vh,440px);flex:0 1 auto}
.stage{width:100%;aspect-ratio:1/1;position:relative;background:#0a0806;border:1px solid var(--line);
  border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 44px rgba(0,0,0,.5);transition:border-color .4s,background .4s}
.rightcol{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 auto;
  align-self:stretch;position:relative}
/* Кошик притиснутий до низу колонки — рівно по нижньому краю холста. */
.trash{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:48px;height:48px;border:0;background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.trash svg{width:22px;height:22px}
.trash:hover{color:var(--bad)}
.invbtn:hover{color:var(--acc-hot)}
.invbtn.on{color:var(--acc-hot)}
.invbtn svg{transition:transform .25s}
.invbtn.on svg{transform:rotate(180deg)}
.stage canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block;
  transition:filter .5s,opacity .6s,transform .6s}
.stage.scanning canvas{filter:brightness(.5) contrast(1.25)}
.stage.failed canvas{opacity:0;transform:scale(.94);filter:blur(6px) grayscale(1)}
.scanline{position:absolute;left:0;right:0;height:4px;top:0;opacity:0;z-index:11;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--acc-hot),transparent);
  box-shadow:0 0 24px var(--acc-hot),0 0 48px color-mix(in srgb,var(--acc) 40%,transparent)}
.stage.scanning .scanline{animation:sweep 1.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes sweep{0%{top:0;opacity:0}7%{opacity:1}93%{opacity:1}100%{top:calc(100% - 4px);opacity:0}}
.grid-ov{position:absolute;inset:0;opacity:0;z-index:10;pointer-events:none}
.stage.scanning .grid-ov{opacity:1;animation:gridpulse 1.6s ease-in-out infinite}
@keyframes gridpulse{0%,100%{opacity:.3}50%{opacity:.7}}
/* ПІДКАЗКА ПРИ НЕВДАЛОМУ СКАНІ лежить просто на полі орнамента: місце
   вільне (орнамент на час невдачі ховається), і текст там видно, на
   відміну від тонкого рядка під полем вводу. */
.veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  padding:20px;text-align:center;background:rgba(10,8,6,.9);
  opacity:0;pointer-events:none;transition:opacity .45s;z-index:12}
body.light-mode .veil{background:rgba(255,253,248,.94)}
.veil svg{width:36px;height:36px;color:var(--bad);flex:0 0 auto}
.veil p{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--bad)}
.veil .tip{font-family:var(--sans);font-size:14px;font-weight:400;line-height:1.45;letter-spacing:0;
  text-transform:none;color:var(--parchment);max-width:32ch}
@media(max-width:820px){.veil .tip{font-size:13px}.veil{gap:7px;padding:14px}}
.stage.failed .veil{opacity:1}

/* ═══════════════ КНОПКИ ═══════════════ */
.action{width:100%;max-width:470px;display:flex;flex-direction:column;gap:10px;position:relative}
.mainbtn{width:100%;font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.05em;
  padding:21px 20px;border-radius:14px;cursor:pointer;transition:.18s;
  border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 32%,transparent),color-mix(in srgb,var(--acc) 12%,transparent));
  color:var(--acc-hot);display:flex;align-items:center;justify-content:center;gap:11px;text-transform:uppercase;min-height:62px}
.mainbtn:hover{border-color:var(--acc-hot);box-shadow:0 0 30px color-mix(in srgb,var(--acc) 30%,transparent)}
.mainbtn svg{width:21px;height:21px;flex:0 0 auto}
.btn-main{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--mono);
  font-size:14.5px;font-weight:700;letter-spacing:.05em;padding:18px 24px;border-radius:14px;cursor:pointer;
  transition:.18s;border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 26%,transparent),color-mix(in srgb,var(--acc) 8%,transparent));
  color:var(--acc-hot);text-decoration:none;text-transform:uppercase;max-width:470px;width:100%;min-height:58px}
.btn-main:hover{border-color:var(--acc-hot);box-shadow:0 0 30px color-mix(in srgb,var(--acc) 30%,transparent)}
.menu{position:absolute;left:0;right:0;bottom:calc(100% + 10px);background:var(--panel);
  border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);border-radius:14px;padding:15px;z-index:40;
  box-shadow:0 -12px 40px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:11px}
.menu-t{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--acc-dim);text-transform:uppercase}
.menu .row{display:flex;gap:9px}.menu .row button{flex:1}
.menu input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--parchment);font-family:var(--mono);font-size:15px;padding:14px;outline:none}
.menu .hint{font-size:12.5px;color:#e5a053;line-height:1.55}
.b{font-family:var(--mono);font-size:14px;font-weight:600;padding:16px 14px;border-radius:11px;
  border:1px solid var(--line);cursor:pointer;background:transparent;color:var(--muted);transition:.15s;min-height:54px}
.b:hover{color:var(--acc-hot);border-color:var(--acc-dim)}
.b.on{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc-hot);
  border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.b.gold{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 26%,transparent),color-mix(in srgb,var(--acc) 8%,transparent));
  border-color:color-mix(in srgb,var(--acc) 55%,transparent);color:var(--acc-hot)}
.b.wide{width:100%}

.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;color:var(--muted);font-family:var(--mono);font-size:14.5px;
  font-weight:700;padding:17px 10px;cursor:pointer;transition:.15s;text-align:center;min-height:58px;
  border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button:last-child{border-right:0}
.seg button.on{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc-hot)}
.seg button:hover:not(.on){color:var(--acc-hot)}
/* Три кнопки вигляду не влазять у ширину колонки великим шрифтом. */
#shape button{font-size:13.5px;padding:17px 4px}

.palette-pop{position:relative}
.palette-panel{position:absolute;top:calc(100% + 8px);left:0;right:0;min-width:250px;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);
  border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);border-radius:12px;padding:14px;z-index:30;
  box-shadow:0 12px 34px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px}
.pal-row{display:flex;flex-direction:column;gap:7px}
.pal-row .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-dim)}
.swatches{display:grid;justify-items:center;grid-template-columns:repeat(7,1fr);gap:6px;background:#8a8580;padding:8px;border-radius:9px}
#sw-alt{grid-template-columns:repeat(8,1fr)}
/* ГОТОВІ ПАЛІТРИ: чотири групи-вкладки, під ними палітри групи */
.pgtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pgtab{font-family:var(--mono);font-size:12px;font-weight:700;padding:9px 6px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--muted);cursor:pointer;transition:.12s}
.pgtab:hover{color:var(--acc-hot);border-color:var(--acc-dim)}
.pgtab.on{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc-hot);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.plist{display:flex;flex-direction:column;gap:6px}
.plbtn{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;font-weight:600;padding:8px 10px;border-radius:9px;
  border:1px solid var(--line);background:transparent;color:var(--parchment);cursor:pointer;text-align:left;transition:.12s}
.plbtn:hover{border-color:var(--acc-dim)}
.plbtn.on{border-color:var(--acc-hot);box-shadow:0 0 0 1px var(--acc-hot) inset}
.plchips{display:flex;flex:0 0 auto;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.plchips i{display:block;width:16px;height:22px}
body.light-mode .pgtab{color:var(--parchment)}
body.light-mode .pgtab.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.sw{width:100%;min-width:0;box-sizing:border-box;aspect-ratio:1;max-width:30px;height:auto;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.12s}
.sw.on{border-color:var(--acc-hot);box-shadow:0 0 8px color-mix(in srgb,var(--acc) 50%,transparent)}
.sw.none{display:flex;align-items:center;justify-content:center;background:transparent;
  border:2px dashed #5f5a55;color:#2a2622;font-family:var(--mono);font-size:15px;font-weight:700}
.rng{width:100%;accent-color:var(--acc);cursor:pointer}
/* ЯСКРАВІСТЬ: посередині — обраний колір, ліворуч темніше, праворуч світліше. */
.rng.bri{-webkit-appearance:none;appearance:none;height:16px;border-radius:8px;border:1px solid var(--line);margin-top:2px}
.rng.bri::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #222;box-shadow:0 0 0 1px #fff}
.rng.bri::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #222}
.volrow{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.shico{display:none;width:22px;height:22px}
.slrow{display:flex;align-items:center;gap:8px}
.sli{display:none;font-size:13px;color:var(--acc-dim);width:14px;text-align:center;flex:0 0 auto}
.volrow .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-dim)}
.motrow{display:flex;gap:6px;flex-wrap:wrap}
.mot{font-family:var(--mono);font-size:12px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);
  background:transparent;color:var(--muted);cursor:pointer;transition:.12s}
.mot:hover{color:var(--acc-hot);border-color:var(--acc-dim)}
.mot.on{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc-hot);
  border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
body.light-mode .mot{color:var(--parchment)}
body.light-mode .mot.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}

/* ═══════════════ СТАТИСТИКА ═══════════════ */
.stat{font-family:var(--mono);display:flex;flex-direction:column}
.stat-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0;
  border-bottom:1px solid var(--line)}
.stat-row:first-child{border-top:1px solid var(--line)}
.stat-row span{font-size:13px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.stat-row b{font-size:26px;font-weight:700;color:var(--acc-hot);line-height:1}
.stat .warn{color:#e5a053;font-size:12.5px;padding-top:10px}

/* ═══════════════ СИМВОЛИ ═══════════════ */
.symtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.symtab{font-family:var(--mono);font-size:19px;padding:11px 15px;border:1px solid var(--line);border-radius:10px;
  background:transparent;cursor:pointer;color:var(--parchment);transition:.15s;line-height:1;flex:0 0 auto}
.symtab.on{background:color-mix(in srgb,var(--acc) 20%,transparent);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.symgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:360px;overflow-y:auto;padding-right:6px}
.symgrid.tarot-row{grid-template-columns:1fr;gap:6px;max-height:400px}
.symgrid.tarot-row button{font-size:128px;padding:0;line-height:1}
.symgrid button{padding:16px 6px;font-size:34px;line-height:1;border:1px solid var(--line);border-radius:10px;
  background:transparent;cursor:pointer;color:var(--parchment);transition:.12s}
.symgrid button:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent);transform:scale(1.06)}

.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:200;transition:opacity .28s}
.stage video.cam-live{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:5;border-radius:16px}
.vf{position:absolute;inset:8%;z-index:8;pointer-events:none}
.vf span{position:absolute;width:26px;height:26px;border:3px solid var(--acc-hot);opacity:.9}
.vf span:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.vf span:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.vf span:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.vf span:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}

/* ═══ ПРИМАРНЕ ДЕМО ═══ напівпрозорі текст і орнамент, плавне розчинення */
#txt{transition:color .8s}
body.ghost #txt{color:color-mix(in srgb,var(--parchment) 45%,transparent)}
#spot{position:fixed;left:50%;top:50%;width:0;height:0;border-radius:50%;pointer-events:none;z-index:8000;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--acc-hot) 55%,transparent),0 0 24px 4px color-mix(in srgb,var(--acc) 25%,transparent),
             0 0 0 200vmax rgba(0,0,0,.2);
  opacity:0;transition:left .6s cubic-bezier(.4,0,.2,1),top .6s cubic-bezier(.4,0,.2,1),
             width .6s cubic-bezier(.4,0,.2,1),height .6s cubic-bezier(.4,0,.2,1),opacity .5s}
#spot.on{opacity:1}
#spot.fast{transition-duration:.18s,.18s,.18s,.18s,.5s}   /* під час друку коло встигає за буквами */

/* ═══ ЛІЧИЛЬНИК БАЙТІВ ═══ у правому нижньому куті поля */
.bytes{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);font-family:var(--mono);
  font-size:12.5px;letter-spacing:.03em;padding:3px 10px;border-radius:8px;
  background:color-mix(in srgb,var(--ink) 82%,transparent);
  color:var(--acc-dim);pointer-events:none;white-space:nowrap;transition:color .2s}
.bytes:empty{display:none}
.bytes.ok{color:var(--ok)}
.bytes.warn{color:#e5a053;font-weight:600}
.bytes.max{color:var(--bad);font-weight:700}
.inp.warn{border-color:#e5a053}
.inp.max{border-color:var(--bad)}
@keyframes bump{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.inp.bump{animation:bump .22s}
body.light-mode .bytes.warn{color:#9a5a00}
/* У світлій темі зелений має бути ТЕМНИМ: світло-зелений по кремовому
   тлі зливається і не читається. */
body.light-mode .bytes.ok,
body.light-mode .rt .g{color:#1d6b3a}

/* Кнопка мерчу на ПК прибрана; на телефоні вмикається в мобільному блоці. */
.a-center .btn-main{display:none}

/* ═══════════════ СВІТЛА ТЕМА: сторінка ═══════════════ */
body.light-mode{background-image:radial-gradient(ellipse 80% 50% at 50% -10%,color-mix(in srgb,var(--acc) 12%,transparent),transparent)}
body.light-mode .stage{background:var(--panel);box-shadow:0 14px 44px rgba(60,45,25,.18)}
body.light-mode .mainbtn,
body.light-mode .btn-main,
body.light-mode .b.gold,
body.light-mode #mobabar button:not(:disabled){background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
body.light-mode .mainbtn:hover,
body.light-mode .btn-main:hover{background:var(--acc-hot);border-color:var(--acc-hot);box-shadow:0 6px 20px rgba(60,45,25,.25)}
body.light-mode .b,
body.light-mode .seg button,
body.light-mode .symtab,
body.light-mode .symgrid button,
body.light-mode .arrow,
body.light-mode .trash,
body.light-mode .cornbtn{color:var(--parchment)}
body.light-mode .b.on,
body.light-mode .seg button.on,
body.light-mode .symtab.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
body.light-mode .inp{background:var(--panel)}
body.light-mode .inp::placeholder{color:var(--muted)}
body.light-mode .menu,
body.light-mode .palette-panel{box-shadow:0 12px 34px rgba(60,45,25,.22)}
body.light-mode .menu input{background:var(--panel)}
body.light-mode #mobabar{background:color-mix(in srgb,var(--panel) 96%,transparent)}
body.light-mode #sheet .sh-b{background:var(--panel);color:var(--parchment)}
body.light-mode .rt .w,
body.light-mode .stat .warn{color:#9a5a00}
body.light-mode .menu .hint{color:#8a4e00}

/* ═══════════════ МОБІЛЬНА СТРІЧКА ═══════════════ */
#mobabar{display:none}
@media(max-width:820px){
  /* ВСЕ НА ОДНОМУ ЕКРАНІ, без вертикального скролу.
     Центральний блок розгортається (display:contents), і його частини
     стають окремими рядками сітки — так кнопку мерчу можна поставити
     під символи, а не під холст.
     Порядок: поле → холст → режим → палітра|форма → символи → мерч. */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  .app{flex:1 1 auto;min-height:0;overflow:visible;
    grid-template-columns:1fr 1fr;grid-template-rows:none;
    grid-template-areas:
      "txt   txt"
      "stage stage"
      "mode  mode"
      "pal   shape"
      "syms  syms"
      "merch merch";
    align-content:start;
    padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  .a-center{display:contents}
  .txtzone{grid-area:txt;max-width:none;padding:6px 10px 2px;gap:2px}
  .stagewrap{grid-area:stage;padding:4px 10px}
  .a-center .action{display:none!important}
  /* На телефоні рядок результату скану теж «парить» під полем, як підказка
     про байти, — і не штовхає орнамент униз. */
  .txtzone{position:relative}
  #rt{position:absolute;left:50%;top:calc(48px + 8px);transform:translateX(-50%);z-index:34;min-height:0;
    white-space:nowrap;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,var(--ink) 82%,transparent)}
  #rt:empty{display:none}
  .inwrap{height:48px}
  textarea.inp.big{height:48px}
  .bytes{font-size:11.5px;top:calc(100% + 4px)}
  .a-center .btn-main{display:flex;grid-area:merch;width:auto;max-width:none;margin:6px 12px 0;
    min-height:46px;padding:10px 14px;font-size:13px}
  .cell{padding:6px 12px;border:0!important}
  .sec-t{display:none!important}
  .a-stat{display:none!important}
  /* телефон: замість підписів — значки форм, під ними тонкий повзунок об'єму */
  .shico{display:block;margin:0 auto}
  .shl{display:none}
  .volrow{margin-top:4px;gap:0}
  .volrow .lbl{display:none}
  .volrow .rng{height:18px;margin:0;min-width:0}
  .sli{display:block}
  /* дві тканинні повзунки — в один ряд, щоб не з'їдати холст */
  .fabrow{display:flex;gap:8px}
  .fabrow .volrow{flex:1 1 0;min-width:0}
  textarea.inp.big{min-height:48px;max-height:55vh;padding:11px 14px;font-size:17px}
  .inwrap{font-size:17px}
  #dbg{display:none}
  /* Холст: ширину обмежують стрілки, висоту — решта екрана (≈ 560px). */
  .stagebox{max-width:min(76vw,calc(100svh - 560px))}
  .arrow{width:40px;height:40px}
  .cornbtn{width:40px;height:40px;font-size:13px}
  .cornbtn.theme svg{width:25px;height:25px}
  .trash{width:40px;height:40px}
  #mobabar{display:flex!important}
  .seg button{padding:10px 6px;font-size:14px;min-height:46px}
  #shape button{font-size:12.5px;padding:10px 3px}
  .b{font-size:14px;padding:10px 10px;min-height:46px}
  /* символи: вкладки — одна стрічка, самі знаки — два ряди, гортаються вбік */
  .symtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:6px;gap:6px}
  .symtabs::-webkit-scrollbar{display:none}
  .symtab{font-size:17px;padding:8px 11px}
  .symgrid,.symgrid.tarot-row{display:grid!important;grid-auto-flow:column;
    grid-template-columns:none;grid-template-rows:repeat(2,50px);grid-auto-columns:50px;
    overflow-x:auto;overflow-y:hidden;max-height:none;gap:6px;padding:0;scrollbar-width:none}
  .symgrid::-webkit-scrollbar{display:none}
  .symgrid button,.symgrid.tarot-row button{width:50px;height:50px;padding:0;font-size:26px}
  .symgrid.tarot-row button{font-size:34px}
  /* палітра випадає ВНИЗ, поверх символів і нижньої панелі */
  .palette-panel{top:calc(100% + 8px);bottom:auto;left:0;right:auto;width:min(86vw,300px);z-index:90}
  #mobabar{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  #mobabar button{padding:14px 10px;min-height:52px;font-size:14.5px}
}
/* НИЗЬКІ ТЕЛЕФОНИ (iPhone SE, 8, mini): два ряди символів і кнопка мерчу
   з'їли б холст до розміру марки. Тут лишаємо один ряд і ховаємо мерч. */
@media(max-width:820px) and (max-height:780px){
  .app{grid-template-areas:
      "txt   txt"
      "stage stage"
      "mode  mode"
      "pal   shape"
      "syms  syms"}
  .a-center .btn-main{display:none}
  .symgrid,.symgrid.tarot-row{grid-template-rows:50px}
  .stagebox{max-width:min(76vw,calc(100svh - 455px))}
}
#mobabar{position:fixed;left:0;right:0;bottom:0;z-index:80;gap:10px;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--ink) 95%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
#mobabar button{flex:1;font-family:var(--mono);font-size:15.5px;font-weight:700;letter-spacing:.04em;padding:19px 12px;
  border-radius:13px;cursor:pointer;text-transform:uppercase;border:1px solid color-mix(in srgb,var(--acc) 58%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 28%,transparent),color-mix(in srgb,var(--acc) 10%,transparent));
  color:var(--acc-hot);display:flex;align-items:center;justify-content:center;gap:8px;min-height:62px}
#mobabar button:disabled{opacity:.4;cursor:default;border-color:var(--line);background:transparent;color:var(--muted)}
#sheet{position:fixed;inset:0;z-index:10000;display:none}#sheet.on{display:block}
#sheet .veil2{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#sheet .card{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top-left-radius:18px;
  border-top-right-radius:18px;padding:14px 16px calc(18px + env(safe-area-inset-bottom));display:flex;
  flex-direction:column;gap:10px;box-shadow:0 -12px 40px rgba(0,0,0,.6);animation:sheetup .22s ease}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:translateY(0)}}
#sheet .sh-t{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--acc-dim);text-transform:uppercase;
  text-align:center;padding:4px 0 6px}
#sheet .sh-b{font-family:var(--mono);font-size:16px;font-weight:600;padding:20px;border-radius:13px;
  border:1px solid var(--line);background:var(--panel2);color:var(--parchment);cursor:pointer;display:flex;
  align-items:center;justify-content:center;gap:10px;min-height:62px}
#sheet .sh-b:active{background:color-mix(in srgb,var(--acc) 16%,transparent)}
#sheet .sh-cancel{color:var(--muted);border-style:dashed}
</style>
</head>

      if(bias[k]<0)t=(t-1)*0.85; else if(bias[k]>0)t=(t+1)*0.85;

const _stCache=new Map();
function hexRGB(h){const q=/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/.exec(h||'');if(q)return [+q[1],+q[2],+q[3]];const m=/^#?([0-9a-f]{6})$/i.exec(h||'');const v=m?parseInt(m[1],16):0;return [v>>16&255,v>>8&255,v&255];}
function rgbHexA(a){return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function lumA(a){return (a[0]*77+a[1]*150+a[2]*29)/256;}
function mixA(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
let REQ=0.7;
/* ТОНИ ОБ'ЄМУ. Кожна літера шаблону — це основний колір нитки, зсунутий
   до білого (блик) або до чорного (тінь) на свою частку.
   ЗАПАС ПІД БЛИК: щоб блику було куди світлішати, світла нитка плавно
   притемнюється (до 200 по яскравості на повному об'ємі), а темна —
   плавно підсвітлюється. Раніше межа була жорсткою (215) і майже не
   чіпала жовтий: блик на жовтому губився, а від перших кроків повзунка
   яскравості об'єм «вмикався» стрибком. Тепер — плавно і для всіх кольорів.
   ЧИТАНІСТЬ: жоден тон не підходить до фону ближче, ніж на 40% відстані
   між ниткою й фоном (у RGB — по кожному каналу окремо). */
const TONE_MIX={T:null, H:['w',0.90], h:['w',0.50], r:['w',0.35], B:['k',0.30], d:['k',0.50], O:['k',0.62]};
function stitchTones(ink,bg){
  const v=volT/100, K=[0,0,0], Wt=[255,255,255];
  let base=hexRGB(ink); const bgc=hexRGB(bg);
  if(v>0){const l=lumA(base), hi=255-55*v, lo=46*v;
    if(l>hi) base=mixA(base,K,(l-hi)/l);
    else if(l<lo) base=mixA(base,Wt,(lo-l)/(255-l));
  }
  /* Тіні й блики стережемо від «уявного» фону — чорного для нитки, світлішої
     за полотно, і білого для темнішої. Справжній фон впливає лише на те,
     з якого боку нитка, тож поки рухаєш яскравість фону, крестики
     лишаються незмінними. Колір фону вирішує тільки, чи код читається. */
  /* у монохромі тіні й блики стережемо в НЕСУЧОМУ каналі — його читає сканер */
  const LV=(layers===3)?lumA:(a=>a[PAL().c]);
  const lb=LV(base), side=(lb>=LV(bgc))?1:-1, lg=side>0?0:255, d=lb-lg;
  const req=Math.min(REQ*Math.abs(d), side*d);
  const toneL=(X,t)=>{
    const lX=LV(X);
    if(Math.abs(d)>1&&lX!==lb){
      const lt=lb+t*(lX-lb);
      if(side*(lt-lg)<req){t=Math.max(0,Math.min(t,(req*side+lg-lb)/(lX-lb)));}
    }
    return mixA(base,X,t);
  };
  /* RGB: декодер читає КОЖЕН канал окремо, тож і тони стережемо по
     каналах. Канал фарби не підходить до фону ближче, ніж на 40%;
     канал, що збігається з фоном, не переходить середину (128). */
  const toneC=(X,t)=>{
    for(let c=0;c<3;c++){const dir=X[c]-base[c];if(!dir)continue;
      const dc=base[c]-bgc[c];let bound,s;
      if(Math.abs(dc)>50){s=Math.sign(dc);bound=bgc[c]+s*REQ*Math.abs(dc);}
      else{s=Math.sign(bgc[c]-128)||1;bound=128+s*0.6*Math.abs(bgc[c]-128);}
      if(Math.sign(dir)!==s){const tc=(bound-base[c])/dir;t=Math.min(t,Math.max(0,tc));}}
    return mixA(base,X,t);};
  const tone=(layers===3)?toneC:toneL;
  const P={T:base,'.':bgc};
  for(const k in TONE_MIX){const m=TONE_MIX[k];if(m)P[k]=tone(m[0]==='w'?Wt:K,m[1]*v);}
  return P;
}
/* frame=1 — клітинка рамки. У кружечків рамка лишається суцільною
   (плитки, а не намистинки): по рівному контуру декодер знаходить код. */
function stitchTile(ink,bg,cell,frame){
  const TPL=(frame&&shape==='circle')?TILE_TPL:shapeTpl();
  const key=ink+bg+cell+'|'+volT+'|'+layers+'|'+shape+'|'+(TPL===TILE_TPL?'t':'');
  let c=_stCache.get(key); if(c)return c;
  if(_stCache.size>64)_stCache.clear();
  const P=stitchTones(ink,bg);
  c=document.createElement('canvas');c.width=c.height=cell;
  const g=c.getContext('2d'),img=g.createImageData(cell,cell),a=img.data;
  for(let py=0;py<cell;py++){const row=TPL[Math.floor(py*STITCH_N/cell)];
    for(let px=0;px<cell;px++){const col=P[row[Math.floor(px*STITCH_N/cell)]];
      const o=(py*cell+px)*4;a[o]=col[0];a[o+1]=col[1];a[o+2]=col[2];a[o+3]=255;}}

}
/* Малюється ОСТАННІМ, уже після інверсії RGB-негатива: світло падає згори завжди. */
function drawStitches(ctx,cell,flip){
  const f=h=>flip?rgbHexA(hexRGB(h).map(v=>255-v)):h;
  for(const [px,py,ink,bg,fr] of STITCH_LIST)ctx.drawImage(stitchTile(f(ink),f(bg),cell,fr),px,py);
}

let AC=null;

function tone(f,d=.15,v=.08,t='sine'){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.00001,c.currentTime+d);o.start();o.stop(c.currentTime+d);}

/* У спокої рядок порожній: службова інформація про декодер з екрана
   прибрана. Після сканування сюди все одно лягає звіт showConf/showFail. */
function dbgIdle(){const el=$('dbg');if(el)el.textContent='';}
function showConf(best){
  const el=$('dbg');if(!el)return;
  const c=best&&best.confidence;
  if(!c){el.innerHTML='<span class="bad">декодер без діагностики — старий файл</span>';return;}
  const last=(window.TainaDecoder&&TainaDecoder.last)||{};
  const chans=(best.channels||[]).filter(t=>t!==null&&t!=='').length;
  const rows=[
    'T='+best.T+'  поле '+best.n+'×'+best.n,
    'звірка '+c.agree+'   рамка '+c.frame+'   голосів '+c.votes,
    (best.rmark?('канали '+chans+'/3  (один текст у трьох)'):(best.kind==='three'?'канали '+chans+'/3  (три тексти)':'монохром'))
      +(best.tinted?'  підфарбований':''),
    (c.blobArea>0.02?('пляма '+Math.round(c.blobArea*100)+'%   '):'')+(last.ms!=null?last.ms+' мс':'')
  ];
  el.innerHTML='<span class="ok">'+rows.filter(Boolean).join('\n')+'</span>';
}
function showFail(){
  const el=$('dbg');if(!el)return;
  const last=(window.TainaDecoder&&TainaDecoder.last)||{};
  const d=last.diagnostic||{};
  const cnt={};
  (d.rejected||[]).forEach(x=>{cnt[x.why]=(cnt[x.why]||0)+1});
  const reasons=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(k=>k+' × '+cnt[k]);
  const cand=(d.stages||[]).find(x=>x.stage==='CANDIDATES');
  const rows=[
    'NO CODE'+(last.ms!=null?'   '+last.ms+' мс':''),
    'чотирикутників: '+(cand?cand.found:'—')+(d.timeout?'   вичерпано час':''),
    reasons.length?('відхилено: '+reasons.join(',  ')):'жодна гіпотеза не дійшла до перевірок'
  ];
  el.innerHTML='<span class="bad">'+rows.join('\n')+'</span>';
}

async function applyScan(best){
  let parts=(best.parts&&best.parts.length?best.parts:[best.res[0]||'']).filter(t=>t);
  /* ОДНАКОВИЙ ТЕКСТ У КАНАЛАХ = ОДИН ТЕКСТ.
     Підфарбований монохром (наприклад, блакитний на синьому) несе той самий
     візерунок у двох каналах. На камері канали бінаризуються трохи по-різному,
     і декодер вважає їх «трьома текстами» — звідси подвоєне
     «Леся Українка · Леся Українка» і перехід у кольоровий режим.
     Справжній кольоровий код має мітку rmark і різні шматки тексту в каналах. */
  let kind=best.kind;
  if(kind==='three'&&!best.rmark&&parts.length>1&&parts.every(t=>t===parts[0])){
    kind='mono'; parts=[parts[0]];
  }
  const colored = kind==='three' || !!best.rmark || (!!best.colored&&kind!=='mono');
  let txt;
  if(kind==='three'){txt=parts.join(' · ');}
  else if(best.kind==='three'){txt=parts[0];}
  else{txt=best.text||best.res[0]||'';}
  isDemo=false;
  if(colored){
    /* схема кольорів знятого коду: інверсія кожного каналу, плюс повний
       негатив, якщо код читався з перевернутого кадру */
    const ci=best.chanInv||[0,0,0], ng=best.negative?1:0;
    const m=(((ci[0]||0)^ng)<<2)|(((ci[1]||0)^ng)<<1)|((ci[2]||0)^ng);
    const k=INV_SEQ.indexOf(m); if(k>=0){rgbStep=k;rgbDeg=k*45;}
  }else invert=!!best.negative;
  setLayers(colored?3:1); syncInv();
  D.single=txt; okChime(); $('txt').value='';
  await typeOut($('txt'),txt,26);
  /* Розшифрований текст показуємо З ПОЧАТКУ — інакше поле прокручене
     до кінця і перші рядки ховаються вгорі. */
  $('txt').scrollTop=0;
  /* Успіх нічого не підписуємо: розшифрований текст сам з'явився в полі —
     це і є повідомлення. Лишається тільки «Відкрити», якщо це посилання. */
  showResult('', txt);
  updateBytes();
}

const MINN=7, MAXN=145;
function Rof(n){return (n-1)/2}
function capacity(m,n){const R=Rof(n);if(m==='oct')return (R+1)*(R+2)/2;if(m==='quad')return (R+1)*(R+1);if(m==='half')return (R+1)*n;return 0;}
function baseCells(m,n){const c=Rof(n),R=c,o=[];if(m==='oct'){for(let i=0;i<=R;i++)for(let j=0;j<=i;j++)o.push([c+i,c+j]);}else if(m==='quad'){for(let i=0;i<=R;i++)for(let j=0;j<=R;j++)o.push([c+i,c+j]);}else{for(let y=0;y<n;y++)for(let i=0;i<=R;i++)o.push([c+i,y]);}return o;}
function mirrors(m,n,x,y){const c=Rof(n),i=x-c,j=y-c;let p;if(m==='oct')p=[[i,j],[j,i],[-i,j],[-j,i],[i,-j],[j,-i],[-i,-j],[-j,-i]];else if(m==='quad')p=[[i,j],[-i,j],[i,-j],[-i,-j]];else p=[[i,j],[-i,j]];const o=[];for(const [a,b] of p){const X=c+a,Y=c+b;if(X>=0&&Y>=0&&X<n&&Y<n)o.push([X,Y])}return o;}
function pickN2(m,need){for(let n=MINN;n<=MAXN;n+=2)if(capacity(m,n)>=need)return n;return MAXN;}

function textBits(t){const data=enc.encode(t);const bits=new Uint8Array(data.length*8);for(let i=0;i<data.length;i++)for(let b=0;b<8;b++)bits[i*8+b]=(data[i]>>(7-b))&1;return {nby:data.length,bits};}
function isClean(t){for(const ch of t){const o=ch.codePointAt(0);if(o===0)return false;if(o<32&&ch!=='\n'&&ch!=='\t')return false;}return true;}
function bytesToText(by){while(by.length&&by[by.length-1]===0)by.pop();if(!by.length)return null;try{const t=decFatal.decode(new Uint8Array(by));return isClean(t)?t:null}catch(e){return null}}
function decodeSector(g,n,m,offset){const bc=baseCells(m,n),by=[];const start=offset||0;for(let i=start;i+7<bc.length;i+=8){let v=0;for(let b=0;b<8;b++){const [x,y]=bc[i+b];v=(v<<1)|(g[y*n+x]?1:0)}by.push(v);}return bytesToText(by);}
function markCell(g,n,m){const [x,y]=baseCells(m,n)[0];return g[y*n+x]?1:0;}

function rowBuild(text,maxB){const chars=[...text],w=maxB*8,h=Math.max(chars.length,1);const g=new Uint8Array(w*h);chars.forEach((c,r)=>{const bs=enc.encode(c);for(let i=0;i<maxB;i++){const v=i<bs.length?bs[i]:0;for(let b=0;b<8;b++)g[r*w+i*8+b]=(v>>(7-b))&1;}});return {g,w,h};}
function rowDecode(g,w,h){if(w%8)return null;const maxB=w/8;if(maxB<1||maxB>4)return null;let out='';for(let r=0;r<h;r++){const bs=[];for(let i=0;i<maxB;i++){let v=0;for(let b=0;b<8;b++)v=(v<<1)|g[r*w+i*8+b];bs.push(v)}while(bs.length&&bs[bs.length-1]===0)bs.pop();if(!bs.length)continue;try{out+=decFatal.decode(new Uint8Array(bs))}catch(e){return null}}return (out&&isClean(out))?out:null;}

function texts(){
  if(layers===1) return [D.single,'',''];
  D.ch=splitThree(D.single); monoMark=1;
  return D.ch.slice();
}

function fillChannel(t,n,m,markBit){const g=new Uint8Array(n*n),dm=new Uint8Array(n*n);const bc=baseCells(m,n);let seq;if(markBit===null){const {bits}=textBits(t);seq=bits;}else{const {bits}=textBits(t);seq=new Uint8Array(bits.length+1);seq[0]=markBit;seq.set(bits,1);}const lim=Math.min(seq.length,bc.length);const ovf=seq.length>bc.length;for(let i=0;i<lim;i++){const [x,y]=bc[i];for(const [X,Y] of mirrors(m,n,x,y)){dm[Y*n+X]=1;if(seq[i])g[Y*n+X]=1}}return {g,dm,ovf};}

function build(){
  const T=texts();
  updateBytes();
  if(!T.some(t=>t.length)){clearStage();['s-ch','s-by','s-bits'].forEach(id=>$(id).textContent='0');$('s-fld').textContent='—';$('s-warn').style.display='none';$('rt').innerHTML='';saveState();return;}
  let nch=0,nby=0,maxBits=0,ovf=false;
  T.forEach(t=>{if(t){nch+=[...t].length;nby+=enc.encode(t).length;maxBits=Math.max(maxBits,enc.encode(t).length*8)}});

  if(mode==='row'){
    let maxB=1;T.forEach(t=>{for(const c of t){const k=enc.encode(c).length;if(k>maxB)maxB=k}});const h=Math.max(...T.map(t=>[...t].length),1);W=maxB*8;H=h;
    CH.forEach((k,i)=>{const g=new Uint8Array(W*H),dm=new Uint8Array(W*H);if(T[i]){const r=rowBuild(T[i],maxB);g.set(r.g.subarray(0,Math.min(r.g.length,g.length)));const rows=[...T[i]].length;for(let y=0;y<Math.min(rows,H);y++)for(let x=0;x<W;x++)dm[y*W+x]=1;}grid[k]=g;dmask[k]=dm;});
    $('s-fld').textContent=W+'×'+H;
  }else{
    const extraR=(layers===3&&monoMark===1)?1:0;const n=pickN2(mode,maxBits+extraR);W=H=n;
    CH.forEach((k,i)=>{let markBit=null;if(layers===3&&monoMark===1&&i===0)markBit=1;const r=fillChannel(T[i]||'',n,mode,markBit);grid[k]=r.g;dmask[k]=r.dm;if(r.ovf)ovf=true;});
    $('s-fld').textContent=n+'×'+n;}

  $('s-ch').textContent=nch;$('s-by').textContent=nby;$('s-bits').textContent=maxBits;$('s-warn').style.display=ovf?'block':'none';render();
  let ok;
  if(mode==='row'){const got=CH.map(k=>rowDecode(grid[k],W,H));ok=CH.every((k,i)=>(got[i]||'')===(T[i]||''));}
  else if(layers===1){ok=decodeSector(grid.r,W,mode,0)===D.single;}
  else if(monoMark===1){const rR=decodeSector(grid.r,W,mode,1),rG=decodeSector(grid.g,W,mode,0),rB=decodeSector(grid.b,W,mode,0);ok=((rR||'')+(rG||'')+(rB||''))===T.join('');}
  else{const got=CH.map(k=>decodeSector(grid[k],W,mode,0));ok=CH.every((k,i)=>(got[i]||'')===(T[i]||''));}
  if(!ok) $('rt').innerHTML='<span class="w">перевір текст</span>';

const FRAME_COL='#8f8f8f';const FRAME_A='#0a0806';const FRAME_B='#f4efe6';
function paint(ctx,cell,pad,qz){
  /* НЕГАТИВ (монохром): одиниця й нуль міняються кольорами, тиха зона
     темніє — як в інвертованих QR-кодах. Сканер, не знайшовши звичайного
     коду, перевертає яскравість кадру і читає такий код.
     У RGB-режимі негатив робиться повною інверсією пікселів у render(). */
  const NEG=invert&&layers!==3;
  const c1=NEG?E0():E1(), c0=NEG?E1():E0();
  /* кольори мотиву: a1 — для одиниць, a0 — для нулів (поля) */
  const MOT=(layers!==3)&&!!motifFn();
  const a1=MOT?(NEG?A0():A1()):null, a0=MOT?(NEG?A1():A0()):null;
  /* темний і світлий колір пари — за НЕСУЧИМ каналом */
  const pdk=(layers!==3)?((chv(c0)<=chv(c1))?c0:c1):null, plt=(pdk===c0)?c1:c0;
  const QZC=(layers!==3)?(NEG?pdk:plt):RGB_BG;   /* тиха зона: світла, у негативі темна */
  /* ВИШИВКА: фон коду, тиха зона і «порожнеча» в стібках — один колір (c0),
     а вся фарба (рамка, темні модулі зебри, одиниці) — нитка (c1). Якщо фон
     темніший за нитку, код виходить «негативним» за будовою — декодер такий
     читає, перевертаючи кадр. */
  const ST=(shape==='cross')||volT>0, MONO=(layers!==3);
  const XS=(shape==='cross');     /* хрестик: фон, тиха зона й порожнеча — один колір */
  STITCH_LIST=[];
  qz=qz||0;const ox=qz*cell,oy=qz*cell;
  /* кольори «полотна» — по них потім лягає фактура тканини */
  const PM=(rgbMask()===7)?0:rgbMask();          /* часткова інверсія — лише поле даних */
  const RGB_DBG=rgbInk(PM&4,PM&2,PM&1);
  BG_COLS=[!MONO?RGB_BG:(XS?c0:QZC), MONO?c0:RGB_DBG].concat(a0?[a0]:[]);
  const TW=(W+pad*2)*cell,TH=(H+pad*2)*cell;
  /* Негатив перевертає ВЕСЬ код, разом із рамкою і тихою зоною, —
     як було. Декодер такий код упізнає: не знайшовши звичайного,
     він перевертає кадр цілком і пробує ще раз. */
  if(qz>0){ctx.fillStyle=!MONO?RGB_BG:(XS?c0:QZC);ctx.fillRect(0,0,TW+ox*2,TH+oy*2);}
  if(pad>=3){
    /* Рамка фарбується палітрою: темні смуги рамки — колір нуля, світлі —
       колір одиниці. Порядок «темне → світле → зебра» для декодера
       зберігається, бо одиниця в палітрі завжди світліша за нуль.
       У RGB-режимі палітри немає — рамка лишається чорно-білою.
       Тиха зона навколо (FRAME_B) — завжди світла: по ній декодер
       знаходить контур коду. */
    /* Кільця рамки розподіляємо ЗА ЯСКРАВІСТЮ, а не за роллю біта:
       зовнішнє кільце — темніша з двох фарб, наступне — світліша.
       Для всіх старих поєднань (світла одиниця + темний нуль) це те саме,
       що було; а для нових — темний візерунок на світлому полі — рамка
       лишається правильною, і код читається. */
    const dk=MONO?pdk:((lum(c0)<=lum(c1))?c0:c1), lt=(dk===c0)?c1:c0;
    /* У негативі кільця міняються місцями разом з усім іншим: світле
       назовні, темне всередину — щоб перевернутим був увесь код, а не
       тільки його начинка. */
    const o1=NEG?lt:dk, o2=NEG?dk:lt;
    let FA=o1, FB=o2;
    if(XS&&MONO){FA=c1;FB=c0;}
    if(!MONO){FA=RGB_INK;FB=RGB_BG;}
    ctx.fillStyle=MONO?c0:RGB_BG;ctx.fillRect(ox,oy,TW,TH);const CW=W+pad*2, CH=H+pad*2;const FBG=MONO?c0:RGB_BG;   /* колір полотна: що НЕ йому дорівнює — те фарба й отримує об'єм */
    const cellAt=(cx,cy,col)=>{ctx.fillStyle=col;ctx.fillRect(ox+cx*cell,oy+cy*cell,cell,cell);if(ST&&col!==FBG)STITCH_LIST.push([ox+cx*cell,oy+cy*cell,col,FBG,1]);};
    for(let cx=0;cx<CW;cx++){cellAt(cx,0,FA);cellAt(cx,CH-1,FA);}
    for(let cy=1;cy<CH-1;cy++){cellAt(0,cy,FA);cellAt(CW-1,cy,FA);}
    for(let cx=1;cx<CW-1;cx++){cellAt(cx,1,FB);cellAt(cx,CH-2,FB);}
    for(let cy=2;cy<CH-2;cy++){cellAt(1,cy,FB);cellAt(CW-2,cy,FB);}
    for(let cx=2;cx<CW-2;cx++){cellAt(cx,2,((cx+2)%2===0)?FA:FB);cellAt(cx,CH-3,((cx+CH-3)%2===0)?FA:FB);}
    for(let cy=3;cy<CH-3;cy++){cellAt(2,cy,((2+cy)%2===0)?FA:FB);cellAt(CW-3,cy,((CW-3+cy)%2===0)?FA:FB);}
  }else if(pad>0){ctx.fillStyle=FRAME_COL;ctx.fillRect(ox,oy,TW,TH);}
  const dataBg=MONO?c0:RGB_DBG;
  ctx.fillStyle=dataBg;
  ctx.fillRect(ox+pad*cell,oy+pad*cell,W*cell,H*cell);
  const put=(x,y,col)=>{ctx.fillStyle=col;const px=ox+(x+pad)*cell,py=oy+(y+pad)*cell;if(ST)STITCH_LIST.push([px,py,col,dataBg]);if(shape==='circle'){ctx.beginPath();ctx.arc(px+cell/2,py+cell/2,cell/2*.94,0,6.2832);ctx.fill()}else ctx.fillRect(px,py,cell,cell)};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(layers===3){const inAny=dmask.r[i]||dmask.g[i]||dmask.b[i];if(!inAny)continue;const on={r:dmask.r[i]&&grid.r[i],g:dmask.g[i]&&grid.g[i],b:dmask.b[i]&&grid.b[i]};if(!on.r&&!on.g&&!on.b)continue;put(x,y,rgbInk(!!on.r!==!!(PM&4),!!on.g!==!!(PM&2),!!on.b!==!!(PM&1)));}else{const band=MOT&&inBand(x,y), pz=MOT&&inSeal(x,y);
      if(dmask.r[i]&&grid.r[i]){const col=band?a1:c1;put(x,y,pz?sealCol(col):col);}
      else if(pz||band){ctx.fillStyle=pz?sealCol(c0):a0;ctx.fillRect(ox+(x+pad)*cell,oy+(y+pad)*cell,cell,cell);}}}
}
/* РОЗМІР МОДУЛЯ. Холст цілиться в 1161 px по стороні й ділиться на повну
   ширину коду в модулях (поле + рамка 3 + тиха зона 2 з кожного боку).
   Результат округлюється до НЕПАРНОГО: у клітинки з'являється справжній
   центральний піксель, бо при непарній стороні центр припадає рівно на
   піксель, а не на стик. Крок модуля — 2 px, тому сусідні розміри поля
   іноді дають однаковий модуль, і холст трохи дихає: 1110–1200 px.
   Цього розміру вистачає для друку, тому при збереженні картинка більше
   не множиться — іде як є. */
function render(){const QZ=2;const pad=(frameW>=2?3:frameW),tw=W+pad*2,th=H+pad*2;const side=Math.max(tw+QZ*2,th+QZ*2);const cell=Math.max(3,2*Math.floor(1161/side/2)+1);OFF.width=(tw+QZ*2)*cell;OFF.height=(th+QZ*2)*cell;OCTX.imageSmoothingEnabled=false;paint(OCTX,cell,pad,QZ);
  /* RGB-негатив: повна інверсія пікселів */
  if(rgbMask()===7){const d=OCTX.getImageData(0,0,OFF.width,OFF.height),a=d.data;for(let i=0;i<a.length;i+=4){a[i]=255-a[i];a[i+1]=255-a[i+1];a[i+2]=255-a[i+2];}OCTX.putImageData(d,0,0);}
  if(STITCH_LIST.length)drawStitches(OCTX,cell,rgbMask()===7);
  applyFabric(OCTX,OFF.width,OFF.height,rgbMask()===7);
  blit();}

function camLoop(){

      const c=document.createElement('canvas');

      const cx=c.getContext('2d',{willReadFrequently:true});

function failTip(){
  const last=(window.TainaDecoder&&TainaDecoder.last)||{};
  const d=last.diagnostic||{};
  const cand=(d.stages||[]).find(x=>x.stage==='CANDIDATES');
  const found=cand?cand.found:0;
  const cnt={};
  (d.rejected||[]).forEach(x=>{cnt[x.why]=(cnt[x.why]||0)+1;});
  const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  if(!found)                       return t('tipFar');    // жодного квадрата в кадрі
  if(d.timeout)                    return t('tipSlow');
  if(top==='структура рамки')      return t('tipFrame');  // відблиск / обрізаний край
  if(top==='втрачено канал')       return t('tipColor');  // кольори поїхали

                                   return t('tipBlur');   // код видно, але нечітко
  return t('tipAny');
}

/* ПАЛІТРИ — тільки базові кольори. Будь-який відтінок, від чорного до
   білого, дає повзунок яскравості під рядком. */
const BASE_COLORS=['#ffffff','#ff0000','#ffff00','#00ff00','#00ffff','#0000ff','#ff00ff'];
const ONE_COLORS=BASE_COLORS, ZERO_COLORS=BASE_COLORS;
/* ═══ RGB-РЕЖИМ: ВІСІМ КОЛЬОРІВ ═══
   Фарби накладаються, як на папері: кожен біт «з'їдає» свій канал.
   Нічого не ввімкнено — найсвітліший сірий (#e6e6e6): це фон, тиха зона
   і порожнеча в стібках. R → блакитний, G → маджента, B → жовтий,
   два біти — червоний/зелений/синій, усі три — майже чорний (#222222).
   Кольори не чисті (0x22…0xe6): лишається запас під блиск і тінь стібка.
   Негатив (◐) перевертає все — фон стає темним. */
const RGB_HI=0xe6, RGB_LO=0x22;
const RGB_BG='#e6e6e6', RGB_INK='#222222';
function rgbInk(r,g,b){const h=v=>(v?RGB_LO:RGB_HI).toString(16).padStart(2,'0');return '#'+h(r)+h(g)+h(b);}

/* ═══════════ ДРУГА ФАРБА І МОТИВ ═══════════
   Частина одиниць малюється іншою фарбою. Колір НЕ несе інформації:
   обидві фарби означають ту саму одиницю, декодер читає код по яскравості.
   Тому друга фарба мусить бути з того ж боку від середини, що й перша:
   обидві темні на світлому полі або обидві світлі на темному.

   Яким клітинкам дістається друга фарба, вирішує мотив. Симетрія ×8
   накладає сюди жорстку умову: правило може залежати ТІЛЬКИ від
   невпорядкованої пари (|i|,|j|) — відстаней клітинки від центру по
   двох осях. Усе інше розірве симетрію орнаменту. Нижче — повний набір
   таких величин, і кожна дає свій впізнаваний мотив вишивки. */
const ALT_COLORS=BASE_COLORS;
const MOTIFS=[
  {k:'none',  uk:'немає',   en:'none',    f:null},
  {k:'rhomb', uk:'ромби',   en:'rhombs',  f:(ai,aj)=>ai+aj},
  {k:'square',uk:'рамки',   en:'frames',  f:(ai,aj)=>Math.max(ai,aj)},
  {k:'medal', uk:'медальйон',en:'medallion',f:(ai,aj)=>Math.round(Math.hypot(ai,aj))},
  {k:'cross', uk:'хрести',  en:'crosses', f:(ai,aj)=>Math.abs(ai-aj)},
  {k:'plus',  uk:'плюс',    en:'plus',    f:(ai,aj)=>Math.min(ai,aj)}
];
function motifFn(){const m=MOTIFS.find(x=>x.k===motif);return m?m.f:null;}
/* Яскравість кольору #rrggbb — за нею рамка обирає, яке кільце темне. */
function lum(h){const m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m)return 128;
  const v=parseInt(m[1],16);return ((v>>16&255)*77+(v>>8&255)*150+(v&255)*29)>>8;}
/* ═══ ПЕЧАТКА ОРНАМЕНТУ ═══
   Мотив фарбує два «вільні» канали, і там випадково може скластися
   читабельний мусор (наприклад, «546 · 4 · ?6?»). Щоб цього не було,
   центр коду (квадрат 5×5) у вільних каналах робимо РІВНИМ: у кожної
   клітинки там вільні канали однакові — sv палітри. Перший байт будь-якого
   вільного каналу тоді виходить 111111xx або 000000xx: це не UTF-8 або
   керівний символ — сканер такий канал відкидає й знає, що це орнамент.
   Несучий канал печатка не чіпає, тож сам код не змінюється. Візуально —
   «серце» орнаменту у двох власних кольорах палітри. */
const SEAL_R=2;
function inSeal(x,y){const c=(W-1)/2;return Math.abs(x-c)<=SEAL_R&&Math.abs(y-c)<=SEAL_R;}
/* КОЛЬОРИ ПЕЧАТКИ підбираються з самої палітри. Вільні канали в печатці
   однакові для нитки й поля (так треба для сканера), а несучий — свій.
   Тож шукаємо ці спільні значення так, щоб обидва кольори печатки
   вийшли якомога ближчими до кольорів, які вже є в орнаменті: поле,
   нитка й обидва кольори мотиву. Печатка тоді виглядає частиною
   візерунка, а не плямою. */
function sealCol(col){const o=PAL().sv.slice(),k=PAL().c;o[k]=hexRGB(col)[k];return rgbHexA(o);}
/* Чи потрапляє клітинка в смугу мотиву. Залежить лише від (|i|,|j|) —
   симетрія ×8 зберігається. */
function inBand(x,y){
  const f=motifFn(); if(!f)return false;
  const c=(W-1)/2, ring=f(Math.abs(x-c),Math.abs(y-c));
  return (((ring%motifK)+motifK)%motifK)<Math.floor(motifK/2);
}

   відстояти від нього достатньо, щоб межа не потонула в шумі камери. */

   Повзунки вільні — людина може зробити що завгодно. Якщо код перестає
   читатися, з'являється червоне попередження; коли знову читається —
   ненадовго зелене «код читається». Кубик видає лише читані поєднання.
   Умови:

   друга фарба — по той самий бік від фону і теж не ближче за MIN_D. */
/* Об'єм робить клітинку строкатою (блиск, тінь, обвідка), тому потрібен

   для будь-якої форми. Перевірено на збережених PNG і на

/* + запас на тканину: що сильніша фактура і крупніше плетіння, то більше.
   Крупне плетіння найнебезпечніше — нитка тканини стає сумірною з модулем. */

let rsTimer=0, rsBad=false;

function rollDice(){

}

/* Поле росте РІВНО під текст: мінімум — один рядок, максимум — 55–60%
   екрана. «Гніздо» (.inwrap) більше не задає мінімальну висоту — воно
   лише тримає місце в розкладці, щоб холст не зрушив. Саме поле лежить
   поверх (absolute), тож коли тексту багато, воно росте вниз і наїжджає
   на орнамент; коли мало — стискається, і орнамент видно повністю. */
function fitField(){
  const el=$('txt'), slot=el&&el.closest('.inwrap'); if(!slot)return;
  const cs=getComputedStyle(el);
  const lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.4;
  const pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  const bord=parseFloat(cs.borderTopWidth)+parseFloat(cs.borderBottomWidth);
  const one=Math.round(lh+pad+bord);          // висота рівно одного рядка
  /* Скидання до одного рядка ОБОВ'ЯЗКОВЕ: інакше scrollHeight повертає
     попередню, більшу висоту, і поле вміє тільки рости, але не стискатись. */
  el.style.height=one+'px';
  const need=el.scrollHeight+bord;
  const cap=Math.round(innerHeight*(innerWidth<=820?0.55:0.6));
  const h=Math.max(one,Math.min(need,cap));
  el.style.height=h+'px';
  /* Тінь — лише коли поле справді наїхало на орнамент. */
  el.classList.toggle('tall',h>slot.clientHeight+2);
}
function grow(el){fitField();}

/* ═══ ПОКАЗ МОЖЛИВОСТЕЙ (один раз при завантаженні) ═══
   Ніби хтось показує відвідувачу сайт: друкує фразу, перемикає режими,
   відкриває палітру й обирає кольори, вмикає негатив, міняє квадрати
   на кружечки. Фраза друкується напівпрозоро — щоб було видно, що це
   не текст користувача.
   Перша ж дія людини (дотик, клік, клавіша, прокрутка) зупиняє показ
   НАЗАВЖДИ, до перезавантаження сторінки: усе, що показ змінив,
   повертається як було, поле й холст порожні. Відтак ніщо не перекриває
   сканування і не з'являється саме по собі.
   Поки йде показ, «Зберегти» неактивна, нічого не зберігається. */
const PHRASES={uk:'Напиши що завгодно',en:'Write anything'};
let tourRun=0, tourDead=false, tourSaved=null;
const tw=ms=>new Promise(r=>setTimeout(r,ms));
function tourAlive(run){return run===tourRun&&!tourDead;}
function tourPick(gi,ii){palG=gi;palI=ii;buildSwatches();render();}
/* ПРОЖЕКТОР: екран темніє на 20%, світле коло перелітає туди, де
   зараз станеться дія, — і лише потім дія відбувається. Затемнення
   зроблене величезною тінню навколо кола (box-shadow), тому коло
   рухається плавно й не заважає клікам (pointer-events:none). */
const spot=document.createElement('div'); spot.id='spot'; document.body.appendChild(spot);
function spotTo(el,mode){
  if(!el)return; const r=el.getBoundingClientRect();
  const R=(mode==='cover')?Math.hypot(r.width,r.height)/2+6:Math.max(r.width,r.height)/2+14;
  spot.style.left=(r.left+r.width/2-R)+'px'; spot.style.top=(r.top+r.height/2-R)+'px';
  spot.style.width=spot.style.height=(2*R)+'px'; spot.classList.add('on');
}
function spotOff(){spot.classList.remove('on');}
function spotAt(cx,cy,R){spot.style.left=(cx-R)+'px';spot.style.top=(cy-R)+'px';spot.style.width=spot.style.height=(2*R)+'px';spot.classList.add('on');}
/* Коло на рядку, де друкується текст. Текст вирівняний по центру поля,
   тож коло стоїть у центрі й розкривається в міру того, як рядок росте. */
const _mctx=document.createElement('canvas').getContext('2d');
function spotText(){
  const el=$('txt'), r=el.getBoundingClientRect(), cs=getComputedStyle(el);
  const fs=parseFloat(cs.fontSize), lh=parseFloat(cs.lineHeight)||fs*1.4;
  _mctx.font=cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
  const w=Math.min(_mctx.measureText(el.value||'').width, r.width-40);
  const cy=r.top+parseFloat(cs.paddingTop)+lh/2;
  spotAt(r.left+r.width/2, cy, Math.max(lh/2+16, w/2+26));
}
/* Прибрати за собою: повернути все, що змінив показ, і очистити поле. */
function tourCleanup(){
  const t=tourSaved||{};
  tourPal(false);
  if(t.palG!=null){palG=t.palG;palI=t.palI;} motif=t.motif||'none'; motifK=t.motifK||4;
  shape=t.shape||'square'; syncSeg('shape','s',shape);
  invert=!!t.invert; syncInv();
  buildSwatches(); setLayers(t.layers===3?3:1);
  isDemo=false; document.body.classList.remove('ghost');
  D.single=''; $('txt').value=''; prevLen=0; build();
}
/* навести коло й дати оку долетіти, перш ніж щось перемкнеться */
async function look(el,mode,run){spotTo(el,mode);await tw(650);return tourAlive(run);}
function swatch(row,col){return [...$(row).children].find(d=>d.style.background&&rgbHex(d.style.background)===col);}
function rgbHex(c){const m=c.match(/\d+/g);return m?'#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join(''):c;}
function tourPal(open){palOpen=open;$('pal-panel').classList.toggle('hide',!open);$('pal-btn').classList.toggle('on',open);fitPal();}
async function tourPlay(){
  const run=++tourRun;
  tourSaved={palG,palI,shape,layers,invert,motif,motifK};
  isDemo=true; document.body.classList.add('ghost');
  const steps=[
    async()=>{                                   // 1. друкує фразу — коло на орнаменті
      spotText(); await tw(650); if(!tourAlive(run))return;   // коло там, де почнеться текст
      const ch=[...(PHRASES[LANG]||PHRASES.uk)];
      spot.classList.add('fast');
      for(let i=1;i<=ch.length;i++){
        if(!tourAlive(run)){spot.classList.remove('fast');return;}
        D.single=ch.slice(0,i).join(''); $('txt').value=D.single; build(); spotText();
        await tw(110+Math.random()*90);
      }
      spot.classList.remove('fast');
      await tw(1300);
    },
    async()=>{ if(!await look($('layers').children[1],'',run))return; setLayers(3); build(); await tw(1500); },  // 2. кольоровий
    async()=>{ if(!await look($('layers').children[0],'',run))return; setLayers(1); build(); await tw(800); },   //    монохром
    async()=>{ if(!await look($('pal-btn'),'',run))return; tourPal(true); await tw(600); },                    // 3. палітра
    async()=>{ if(!await look($('pg-tabs').children[0],'',run))return; tourPick(0,0); await tw(900); },          //    традиційні: червоно-чорна
    async()=>{ if(!await look($('pl-list').children[1],'',run))return; tourPick(0,1); await tw(1000); },         //    синьо-біла
    async()=>{ if(!await look($('mot-row').children[1],'',run))return; motif='rhomb'; buildMotifRow(); render(); await tw(1200); },  // мотив
    async()=>{ if(!await look($('mot-row').children[0],'',run))return; motif='none'; buildMotifRow(); render(); await tw(600); },
    async()=>{ if(!await look($('pal-btn'),'',run))return; tourPal(false); await tw(400); },
    async()=>{ if(!await look($('invBtn'),'',run))return; invert=true; syncInv(); build(); await tw(1500); },   // 4. негатив
    async()=>{ invert=false; syncInv(); build(); await tw(800); },                                              //    позитив
    async()=>{ if(!await look($('shape').children[1],'',run))return; shape='circle'; syncSeg('shape','s',shape); syncPalRows(); render(); await tw(1400); },  // 5. кружечки
    async()=>{ if(!await look($('shape').children[2],'',run))return; shape='cross'; syncSeg('shape','s',shape); syncPalRows(); render(); await tw(1600); },   //    хрестики
    async()=>{ if(!await look($('shape').children[0],'',run))return; shape='square'; syncSeg('shape','s',shape); syncPalRows(); render(); await tw(900); },   //    квадрати
    async()=>{ if(!await look($('stage'),'cover',run))return; await tw(900); },                              // погляд на результат
    async()=>{ if(!await look($('clr'),'',run))return;                                                        // 6. кошик прибирає за собою
               tourCleanup(); tone(320,.09,.06,'triangle'); await tw(900); },
    async()=>{ spotText(); await tw(800); if(!tourAlive(run))return;                                           // 7. місце — людині
               tourDead=true; spotOff();
               /* курсор у полі. На телефоні не фокусуємо: без дотику людини
                  клавіатура все одно не відкриється, а сторінку може смикнути. */
               if(matchMedia('(pointer:fine)').matches)$('txt').focus(); }
  ];
  for(const st of steps){ if(!tourAlive(run))return; await st(); }
  /* Показ завершився сам — результат лишається на екрані, доки людина
     щось не зробить. */
}
function tourStop(){

}
/* Лише СПРАВЖНІ дії людини (isTrusted) — програмні кроки показу подій не шлють. */

/* ═══ ПАМ'ЯТЬ ЛАБОРАТОРІЇ ═══
   Пішов у Галерею й повернувся — текст, режим, форма і кольори на місці.

const LAB_KEY='taina_lab_state';

/* ═══ МЕЖА ДОВЖИНИ — У БАЙТАХ, однакова для обох режимів ═══
   Кирилиця — 2 байти на літеру, латиниця — 1, емодзі — 4. Режим можна
   перемикати будь-коли, тож межа рахується за найсуворішим — монохромом.
     до BYTE_SAFE — спокійно: камера читає навіть дрібний код;
     до BYTE_MAX  — зона ризику: попередження, але друкувати можна;
     BYTE_MAX     — стоп: далі не друкується. На цій довжині код ще
                    гарантовано читається з файлу (перевірено). */
/* Пороги виміряні імітацією камери (монохром, кирилиця):
     ≤50 Б — читається при будь-якому розмірі коду в кадрі, від 300 px;
     60 Б  — дрібний код (300 px) уже не читається;
     80–100 Б — лише великий код (~500–600 px у кадрі), і не завжди;
     100 Б — з файлу читається в усіх режимах і варіантах (перевірено 13 видів). */
const BYTE_SAFE=50, BYTE_MAX=100;
let byteZone='ok';
function bytesOf(t){return enc.encode(t).length;}
/* Вставка, що не влазить, обрізається по символах — і саме вставлене,
   а не те, що вже написано. Видаляти можна завжди. */
function fitBytes(old,nw){
  if(bytesOf(nw)<=BYTE_MAX||bytesOf(nw)<=bytesOf(old))return null;
  let pre=0; while(pre<old.length&&pre<nw.length&&old[pre]===nw[pre])pre++;
  if(pre>0&&/[\uD800-\uDBFF]/.test(nw[pre-1]))pre--;            // не рвати емодзі навпіл
  let suf=0; while(suf<old.length-pre&&suf<nw.length-pre&&old[old.length-1-suf]===nw[nw.length-1-suf])suf++;
  if(suf>0&&/[\uDC00-\uDFFF]/.test(nw[nw.length-suf]))suf--;
  const head=nw.slice(0,pre), tail=nw.slice(nw.length-suf), ins=nw.slice(pre,nw.length-suf);
  let room=BYTE_MAX-bytesOf(head+tail), out='';
  for(const ch of ins){const b=bytesOf(ch); if(b>room)break; out+=ch; room-=b;}
  return {value:head+out+tail, caret:(head+out).length};
}
function updateBytes(){
  const el=$('bytes'), f=$('txt'); if(!el)return;
  fitField();
  const b=bytesOf(f.value), zone=b>=BYTE_MAX?'max':(b>BYTE_SAFE?'warn':'ok');
  /* Порожньо, показ, або під полем уже стоїть результат скану — мовчимо. */
  const busyLine=$('rt')&&$('rt').textContent.trim();
  if(!b||isDemo||busyLine){el.textContent='';el.className='bytes';f.classList.remove('warn','max');byteZone=b?zone:'ok';return;}
  /* У спокійній зоні — ЖОДНОГО напису: те, що код читається, і так видно.
     Підпис з'являється лише тоді, коли є що сказати: наближається межа
     або її вичерпано. */
  if(zone==='ok'){el.textContent='';el.className='bytes';f.classList.remove('warn','max');byteZone='ok';return;}
  const msg=zone==='max'?t('bMax'):t('bWarn');
  el.textContent=msg+' · '+b+' / '+BYTE_MAX+' '+t('bUnit');
  el.className='bytes '+zone;
  f.classList.toggle('warn',zone==='warn'); f.classList.toggle('max',zone==='max');
  /* звуковий сигнал — лише в момент входу в нову зону */
  if(zone!==byteZone){ if(zone==='warn')tone(523,.12,.06,'triangle'); if(zone==='max')tone(330,.16,.07,'triangle'); }
  byteZone=zone;
}

  if(typeof syncMain==='function'){const _sm=syncMain;window.syncMain=function(){_sm.apply(this,arguments);syncMobSave();};}
  setInterval(syncMobSave,500);
  $('mb-save').onclick=()=>{if(!hasImage||isDemo)return;var n=prompt('Назва файлу:',defaultName());if(n===null)return;n=n.trim().replace(/[\\/:*?"<>|]/g,'_')||'taina';savePNG(n);};
  $('mb-scan').onclick=()=>openSheet();
  const sheet=document.createElement('div');sheet.id='sheet';
  sheet.innerHTML='<div class="veil2"></div><div class="card"><div class="sh-t">Сканувати код</div><button class="sh-b" id="sh-cam">📷 Камера</button><button class="sh-b" id="sh-file">🖼 Завантажити з галереї</button><button class="sh-b sh-cancel" id="sh-x">Скасувати</button></div>';
  document.body.appendChild(sheet);
  function openSheet(){sheet.classList.add('on');} function closeSheet(){sheet.classList.remove('on');}
  sheet.querySelector('.veil2').onclick=closeSheet; $('sh-x').onclick=closeSheet;
  $('sh-cam').onclick=()=>{closeSheet();if(typeof startCam==='function')startCam();};
  $('sh-file').onclick=()=>{closeSheet();const f=$('file');if(f)f.click();};
  const vv=window.visualViewport;
  function onKbd(){if(!mq.matches){document.body.classList.remove('kbd');return;}const kb = vv ? (window.innerHeight - vv.height > 140) : false;document.body.classList.toggle('kbd',kb);}
  if(vv){vv.addEventListener('resize',onKbd);vv.addEventListener('scroll',onKbd);}
  document.addEventListener('focusin',e=>{if(mq.matches&&e.target.classList&&e.target.classList.contains('inp'))document.body.classList.add('kbd');});
  document.addEventListener('focusout',()=>{setTimeout(onKbd,60);});
})();
(function(){var st=$('stage');if(st)st.addEventListener('click',function(){
  if(typeof camStream!=='undefined'&&camStream&&typeof stopCam==='function')stopCam();
  /* Прочитав підказку — прибрав дотиком, не чекаючи таймера. */
  st.classList.remove('failed');
});})();

function applyLang(){
  const q=sel=>document.querySelector(sel), qa=sel=>document.querySelectorAll(sel);
  q('.a-mode .sec-t').textContent=t('secMode');
  q('.a-shape .sec-t').textContent=t('secLook');
  q('.a-syms .sec-t').textContent=t('secSym');
  q('#layers button[data-l="1"]').textContent=t('mono');
  q('#layers button[data-l="3"]').textContent=t('rgb');
  q('#pal-btn').textContent=t('pal');
  const ml=q('#row-mot .lbl'); if(ml)ml.textContent=t('motifL');
  buildSwatches();
  const vl=$('vol-lbl'); if(vl)vl.textContent=t('vol');
  const fl=$('fab-lbl'); if(fl)fl.textContent=t('fab'); const gl=$('fabg-lbl'); if(gl)gl.textContent=t('fabg');
  ['bri-one','bri-zero','bri-alt'].forEach(id=>{const e=$(id);if(e)e.title=t('bri');});
  const pv=$('pres-vysh'); if(pv)pv.textContent=t('vysh');
  buildMotifRow();
  [['square','sq'],['circle','ci'],['cross','cr']].forEach(([k,l])=>{const b=q('#shape button[data-s="'+k+'"]');
    if(b){b.title=t(l);const sp=b.querySelector('.shl');if(sp)sp.textContent=t(l);}});
  const st=qa('.stat-row span'), keys=['chars','bytes','bits','field'];
  st.forEach((el,i)=>{if(keys[i])el.textContent=t(keys[i]);});
  $('s-warn').textContent=t('warn');
  $('txt').placeholder='';   /* у фокусі поле має бути зовсім порожнім */
  const merch=q('.a-center .btn-main'); if(merch)merch.textContent=t('merch');
  $('undo').title=t('undo'); $('redo').title=t('redo'); $('clr').title=t('clear'); syncInv();
  $('themeBtn').title=t('theme');
  $('langBtn').textContent=(LANG==='en')?'EN':'UA';
  const mbS=$('mb-save'), mbC=$('mb-scan');
  if(mbS)mbS.textContent=t('mbSave'); if(mbC)mbC.textContent=t('mbScan');
  const sh=$('sheet');
  if(sh){sh.querySelector('.sh-t').textContent=t('shTitle');
    $('sh-cam').textContent=t('shCam'); $('sh-file').textContent=t('shFile'); $('sh-x').textContent=t('shCancel');}
  syncMain(); updateBytes();
  /* Шапку малює оболонка — просимо її перемалюватися новою мовою. */
  if(window.TainaShell&&TainaShell.setLang)TainaShell.setLang(LANG);
  /* Демо — теж текст інтерфейсу, тож міняється разом з мовою. */
}
$('langBtn').onclick=()=>{
  LANG=(LANG==='en')?'uk':'en';
  try{localStorage.setItem('taina_lang',LANG);}catch(e){}
  applyLang(); tone(680,.07,.05);
};
applyLang();

</script>
